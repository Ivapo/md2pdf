       * row has no `main` button: the gesture would ask for what is already
       * true. **That is the one gesture a reader might expect and not get** —
       * clicking the row you are on while a figure is up does nothing — and it
       * is accepted rather than fixed, the alternative being a row whose
       * drawing depends on page state where holding no selection is what lets
       * the panel be rebuilt whole on every status.
       *
       * @param {Entry} entry @param {number} depth @param {boolean} here
       * @param {boolean} holding
       * @returns {HTMLElement}
       */
      function fileRow(entry, depth, here, holding) {
        const opens = entry.kind === 'markdown' && !entry.missing && !holding
        const shows = entry.kind === 'image' && !entry.missing

        const li = document.createElement('li')
        li.className = `${here ? 'here ' : ''}${holding ? 'holding ' : ''}${
          entry.missing ? 'missing' : ''
        }`.trim()
        li.dataset.depth = String(Math.min(depth, 5))
        li.dataset.kind = entry.kind
        li.title = entry.missing
          ? `${entry.path} — named by the document, and not on disk`
          : opens
            ? `Edit ${entry.path}`
            : shows
              ? `Look at ${entry.path}`
              : entry.kind === 'markdown'
                ? entry.path
                : `${entry.path} — not edited here`

        const label = document.createElement(opens || shows ? 'button' : 'span')
        label.className = 'name'
        label.textContent = entry.path.split('/').pop() ?? entry.path
        if (label instanceof HTMLButtonElement) {
          label.type = 'button'
          label.addEventListener('click', () =>
            opens ? openInPane(entry.path) : showAsset(entry.path)
          )
        }
        li.append(label)

        if (here) {
          const mark = document.createElement('span')
          mark.className = 'mark'
          mark.textContent = '◀ main'
          li.append(mark)
          return li
        }

        /* The two buttons share one right edge rather than each claiming it,
           which is what `.controls` is for and the whole of why it exists. */
        const controls = document.createElement('span')
        controls.className = 'controls'

        if (entry.kind === 'markdown' && !entry.missing) {
          controls.append(
            control('set', 'main', `Compile ${entry.path} instead`, () => setMain(entry.path))
          )
        }
        /* **A marked-missing row gets none**: it names a file the disk does not
           hold, so there is nothing to move — and the `main` row returned
           above, its file being the one refused. Images and bibliographies do
           get one: the panel lists them, and a figure the document stopped
           naming is a thing to be rid of. */
        if (!entry.missing) {
          controls.append(
            control('trash', 'trash', `Move ${entry.path} to the Trash`, () =>
              trashFile(entry.path)
            )
          )
        }

        if (controls.childElementCount > 0) li.append(controls)
        return li
      }

      /**
       * One of a row's small quiet buttons.
       *
       * @param {string} kind @param {string} label @param {string} title
       * @param {() => void} act
       * @returns {HTMLButtonElement}
       */
      function control(kind, label, title, act) {
        const button = document.createElement('button')
        button.type = 'button'
        button.className = kind
        button.textContent = label
        button.title = title
        button.addEventListener('click', act)
        return button
      }

      /*
        Set which file the project compiles.

        It goes through `clear()` for `openDocument`'s reason and not for
        tidiness: Rust rebuilds the preview from scratch, restarting `revision`
        and `reloaded` at 0, and this page compares its own counters against
        them.
      */
      async function setMain(path) {
        clear()
        try {
          await invoke('set_main', { path })
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        Put another of the project's files in the pane.

        **It does not `clear()`, and that is the difference between this and an
        open.** Rust keeps the preview it has — the root, the main, the listing,
        the bytes and both counters — and only moves the edited file, so a page
        that reset the counters it compares Rust's against would sit at
        `refresh`'s own guard and draw nothing again.

        A refusal comes back as a status rather than as a throw: Rust announces
        it, `refresh` fetches it, and the sentence lands in the divergence bar
        with the way out beside it.
      */
      async function openInPane(path) {
        // Asking for a file puts the text back: this already means *put that
        // file in the pane*, and it must not leave a picture over it.
        hideAsset()
        try {
          await invoke('set_edited', { path })
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        Move one of the project's files to the Trash.

        **Nothing asks first**, and that is the decision rather than an
        omission: the Trash is the platform's own undo for this operation, and
        a confirmation is what stands in for an undo where there is none.
        Finder does not confirm a move to the Trash for the same reason.

        **Nothing here redraws the panel either.** A deleted section is already
        in the asset list, so the watch answers `Change::Asset` and never the
        listing refresh a create rides on — Rust re-walks and announces, and
        `refresh` draws what comes back.

        A refusal comes back as a throw and lands in the error bar, exactly as
        `openInPane`'s does. None of the three is reachable from a row: the
        `main` row draws no button, and every other row came out of this app's
        own listing.
      */
      async function trashFile(path) {
        // The figure you are looking at may be the one going: put the text back
        // rather than leave a picture of a file that is gone.
        hideAsset()
        try {
          await invoke('trash_file', { path })
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        Throw the pane's unsaved edits away and take the file as it stands.

        The one way out of both refusals this app makes, and the only thing here
        that discards anything. Rust re-reads the file and announces, so the
        pane's text comes back through `refresh`'s own reload branch rather than
        being written here.
      */
      async function discardEdits() {
        try {
          await invoke('discard')
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        **The pane draws the page itself.** One page per page in a container
        this app owns and scrolls: a canvas `pdf.js` rasterises off the main
        thread, with the text it carries and the links it carries laid over
        that raster. Nothing here hands the bytes to a viewer somebody else
        wrote, so the fit is an expression this file evaluates rather than a
        parameter a loader reads once.

        The bytes cross raw and **`getDocument` transfers the buffer to the
        worker**, so they cannot be read twice. The proxy is kept, because a
        re-render caused by geometry alone must not need new ones — and the
        one it replaces is destroyed, or its worker-side document leaks on
        every compile.

        Where the reader lands is by cause, and the causes are the ones
        `refresh` already distinguishes: a compile that took a text from disk
        opens at page 1, a compile after the author's own edit opens at the
        caret's page, and a compile landing while a width is still moving
        keeps the reader where the gesture left them — that one for that
        compile only, because the page must never move out from under a hand
        that is on it.
      */
      /**
       * @param {ArrayBuffer} bytes
       * @param {number | null} page
       */
      async function openPdf(bytes, page) {
        const seq = ++renderSeq
        cancelRenders()

        const next = pdfjs.getDocument({ data: new Uint8Array(bytes) })
        const opened = await next.promise
        if (seq !== renderSeq) {
          next.destroy()
          return false
        }
        loading?.destroy()
        loading = next
        doc = opened
        docGen++

        // Before the width is read: an element that is `display: none`
        // measures zero, and the scale is that measurement.
        pages.hidden = false
        if (!(await renderPages(seq))) return false

        /*
          **The reader is put where they belong before a raster is asked for,
          and that order is this phase's whole claim.** Every page is already at
          its final size when the sizing pass returns, so this lands exactly
          where it will stay. Drawing first and scrolling afterwards would spend
          the pass on whatever sits at `scrollTop` 0, jump the reader off it,
          and leave a placeholder under them until the next rest — reaching an
          identical end state by way of a visible one.
        */
        if (anchor !== null) applyAnchor(anchor)
        else if (page === null) pages.scrollTop = 0
        else applyAnchor({ page: page - 1, fraction: 0 })

        await refill(seq)
        return true
      }

      /*
        **Lay the whole document out, and draw nothing.**

        Every page gets a box sized from its own viewport, so the child list,
        `scrollHeight`, every `offsetTop`, the gap between pages, the fit and the
        reader's anchor are right over the whole document from the first frame —
        whether or not a raster ever arrives for a given page. The extent is
        exact from layout alone: 53,337 px for a 71-page document at a 520 px
        pane, before any page is rastered and after every one of them is.

        **The scale is chosen here and nowhere else**, one expression per fit
        and all three in `scaleFor`: `paneWidth / natural.w` under width,
        `min(paneWidth / natural.w, paneHeight / natural.h)` under page, and
        the reader's own number under manual. It is recomputed on every pass,
        so a re-derived fit cannot go stale — and the pass **stores what it
        derived**, in `fitted`, which is what a later pass compares against.
        What it costs to *raster* those pages is a separate question, and the
        budget below is where it is asked.

        **It commits in one mutation.** Appending a page at a time grows
        `scrollHeight` across frames and hands the observer seventy-one
        deliveries where one was wanted. And it *reconciles* rather than
        rebuilding: a compile reuses the boxes already there and removes only the
        surplus, so the elements the reader's place is measured against survive
        it.
      */
      async function renderPages(seq) {
        rendering++
        try {
          return await layoutPages(seq)
        } finally {
          rendering--
        }
      }

      async function layoutPages(seq) {
        // One measurement for the whole pass. `scaleFor` takes it rather than
        // reading it, so no page in a list can be laid out against a box a
        // page before it moved.
        const room = box()
        if (!(room.width > 0)) return false // a pane with no width to fit to

        // Held rather than re-read: `clear` and a re-open both replace `doc`,
        // and this pass must find out by its own generation check rather than by
        // measuring a different document halfway down.
        const from = doc
        const started = performance.now()

        const list = []
        let grew = false
        // The scale this pass derived, unrounded, taken from the first page —
        // which is the page `derived()` re-derives against.
        let held = null

        try {
          for (let n = 1; n <= from.numPages; n++) {
            const page = await from.getPage(n)
            if (seq !== renderSeq) return false

            /*
              The page's own size in unscaled PDF units — 595.28 × 841.89 for
              A4 — which is both what the fits are expressions in and what
              `setLayerDimensions` multiplies, so `--total-scale-factor` is
              measured against the same pair. It is a property of the document
              and does not move with the pane.
            */
            const unit = /** @type {UnitViewport} */ (page.getViewport({ scale: 1 }))
            const natural = { w: unit.rawDims.pageWidth, h: unit.rawDims.pageHeight }

            const scale = scaleFor(natural, room)
            if (n === 1) held = scale
            const viewport = page.getViewport({ scale })

            /*
              The logical size is taken to whole CSS pixels and the backing
              store is derived from it, so that the backing store is exactly
              `floor(cssWidth × devicePixelRatio)`. Under fit-to-width the two
              are one number in exact arithmetic — `natural.w × (paneWidth /
              natural.w)` is the pane width — but in floating point it lands
              an ulp under, and flooring that costs a device pixel the CSS
              size still claims. Rounding here also makes that fit exact
              rather than an ulp short of the pane.

              **The scale is stored before this rounding and not after it.**
              `fitted` holds what `scaleFor` returned; recovered from the box
              below as `logical.w / natural.w` it would be a different number,
              and one that never equals a fit-page derivation.
            */
            const cssWidth = Math.round(viewport.width)
            const cssHeight = Math.round(viewport.height)

            let wrapper = pages.children[n - 1]
            if (!wrapper) {
              // `any` and not `PageWrapper`: a bare div is not one yet, and
              // the four assignments below are what make it one.
              wrapper = /** @type {any} */ (document.createElement('div'))
              wrapper.className = 'page'
              grew = true
            }

            // What the CSS size is written from, here and through a gesture.
            wrapper.logical = { w: cssWidth, h: cssHeight }
            wrapper.natural = natural
            /*
              The viewport this page would be drawn with, kept for the one thing
              that turns a PDF coordinate back into a CSS one: a destination. It
              is written by this pass and not by the render, which is what lets a
              cross-reference into a page holding no raster land at its own
              coordinate rather than throwing.
            */
            wrapper.view = viewport
            wrapper.number = n
            size(wrapper, 1)
            list.push(wrapper)
          }
        } catch (problem) {
          /*
            Superseded — by another pass, by a re-open, or by `clear` destroying
            this document out from under the loop. None of those is news, and the
            generation check is what tells them from a real failure, which is
            re-thrown for `refresh` to put on the page.
          */
          if (seq !== renderSeq) return false
          throw problem
        }

        if (grew || pages.children.length !== list.length) {
          // A document that lost pages leaves them behind it, and a page that
          // goes must give its raster back on the way out — nothing else will,
          // because the element is about to stop being reachable.
          const keeping = new Set(list)
          for (const wrapper of pages.children) {
            if (!keeping.has(wrapper)) release(wrapper)
          }
          pages.replaceChildren(...list)
        }

        // Every page above was written at its logical size already; this is the
        // function that owns the rule, and it is what closes a gesture.
        unscale()
        fitted = held
        pane.scale = held
        pane.sizingMs = since(started)
        return true
      }

      // What the next render cancels. A sizing pass starts none of its own, so
      // these are pages the drainer put in flight; a task cancelled here rejects
      // inside `paint`, and `drain` swallows it the way `rerender` does.
      function cancelRenders() {
        for (const task of inflight) task.cancel()
        inflight.clear()
      }

      /*
        **The pane holds what the reader is near.**

        One canvas at fit-to-width costs 5.8 MiB at this app's default pane, so a
        71-page document costs 414 MiB and a longer one costs more, without
        bound. Under a budget the pane draws the document whole and nothing a
        reader sees changes. Over it the pane holds only the pages the reader is
        near and lets the rest go — and the page a compile takes the reader to
        arrives without waiting for the seventy pages they are not looking at.

        **128 MiB is chosen and not derived.** It admits 21 pages at the default
        window and 15 at a wide one. What would ground it is the length at which
        this webview actually jettisons its content process, which nobody has
        measured; until then this is a number that keeps a quantity from growing
        rather than one that prevents a crash it has seen.

        **The rest is 120 ms**, beside the width's 200, and it is chosen too: a
        scroll stops more often than a drag does. Too short and an ordinary slow
        scroll draws pages the reader is already past; too long and a reader who
        stops waits for the page under them. Nothing has measured it against a
        reader, which is the only instrument that can.
      */
      const BUDGET = 128 * 2 ** 20
      const REST = 120

      /*
        **Which document a raster belongs to — and it is not `renderSeq`.** A
        canvas is the one the pane wants only if it was drawn from this document
        *and* for this width; either one stale counts as absent.

        It cannot be `renderSeq`, which is what an implementer reaches for:
        `rerender` bumps that at every width rest, so every canvas would be stale
        at every rest and the pair below could never disagree. **Generation alone
        loses the author's own edit** — a page already holding a raster would
        never be drawn again after a compile. **Width alone leaves every page
        holding a canvas made for the old width after a rest**, soft, which is
        Phase 1's *comes back sharp when you let go* regressed by a freshness
        test that reads correctly.

        **The width term needs no property of its own.** A backing store is
        `floor(logical.w × devicePixelRatio)` by construction, so comparing
        `canvas.width` against that expression *is* the test — and it stays right
        across a change of display, which a remembered width would not.
      */
      let docGen = 0

      // Whether the pane is holding every page or only the ones the reader is
      // near. Decided by the budget at the two passes that can move it, and
      // never once per document.
      let mode = 'whole'

      // The pages the reader is near. **Maintained and not rebuilt**: after its
      // first delivery the observer reports only what changed.
      /** @type {Set<PageWrapper>} */
      const wanted = new Set()
      let watcher = null

      // One pass at a time, what a scroll that has not rested looks like, and
      // the timer that ends it. `pending` is a forced pass that arrived while
      // another was running: it is re-run rather than dropped, because nothing
      // else will re-arm it — whole mode has no observer and a document that
      // fits the pane emits no scroll.
      let draining = false
      let pending = false
      let moving = false
      /** @type {ReturnType<typeof setTimeout> | null} */
      let resting = null

      // Resolves at the observer's first delivery, so a forced pass can wait for
      // the set it is about to read rather than for a fixed number of frames.
      let delivered = null

      /*
        What this phase's exit gate reads. **It ships, and that is a decision.**
        Nothing in this repository reaches this file, so its gate is read by a
        person at a console — and three of the quantities that gate needs, the
        renders started, what the sizing pass cost and when the observer first
        delivered, live inside a module and are reachable from nowhere else.
      */
      const pane = {
        mode,
        // The fit the reader asked for, and the scale the layout derived from
        // it — which is `fitScale` exactly under a pinned one. Nothing else in
        // the window reports either, and the gate is read at a console. Both
        // are filled in below rather than here: the fit's own state is
        // declared with the geometry it belongs to, further down this file.
        fit: null,
        scale: null,
        renders: 0,
        sizingMs: null,
        deliveryMs: null,
        renderMs: null,
        made: 0,
        released: 0
      }
      window['__pane'] = pane

      const since = (started) => Math.round((performance.now() - started) * 10) / 10

      // What one page's raster costs in bytes, which is the only term in the
      // budget — and the pane's width is inside it, which is why a budget in
      // pages is really a budget in megabytes.
      /** @param {PageWrapper} wrapper */
      function cost(wrapper) {
        const ratio = window.devicePixelRatio
        return (
          Math.floor(wrapper.logical.w * ratio) *
          Math.floor(wrapper.logical.h * ratio) *
          4
        )
      }

      /*
        Decide what the pane holds, **at the three passes that can move it and
        never once per document**: an open, a width rest, and a fit change. A
        drain after a scroll re-evaluates nothing, correctly — scrolling moves
        no width and no fit.

        **The third pass costs nothing to add**, and that is the argument for
        the fit change riding the width rest's path rather than owning one: it
        reaches `refill`, and this already lives there. It is not optional. A
        scale multiplies a page's cost by its square — 30.6 MiB at 200% where
        fit-to-width costs 7.6 — so an implementation that re-derived the
        scale without re-deciding what is held would hold a 20-page document
        whole at 612 MiB on a budget of 128.

        Five shipped causes move the *width* term: the divider, a window
        resize, the section panel folding, the line gutter, and an open
        itself, since the panel is shown for any open document at all and the
        status that decides it arrives before the bytes do.
      */
      function decideMode() {
        let whole = 0
        for (const wrapper of pages.children) whole += cost(wrapper)
        mode = whole <= BUDGET ? 'whole' : 'band'
        pane.mode = mode
      }

      /*
        **Watch which pages the reader is near rather than computing them** —
        `mpdf-003` Phase 7's rule, that geometry is observed and not inferred
        from the events believed to change it, on the one axis it had not
        reached. The margin is one scrollport either side, written as a
        percentage so that a resize needs no rebuild.

        **It is established afresh after every sizing pass**, at an open and at
        every width rest, while the mode is band — and not per drain, which would
        be an establish-and-deliver loop that renders nothing. A compile that
        *grew* the document would otherwise keep an observer whose targets do not
        include the new trailing pages, and a page the author had just written
        could never be drawn. A fresh `observe()` over the reconciled list is
        also what drops the old registrations, so nothing is unobserved by hand.

        An observer holds its targets strongly, so one left attached across an
        open goes on releasing pages out of the document that replaced them.
      */
      function watch() {
        watcher?.disconnect()
        watcher = null
        wanted.clear()
        // Cleared before the early return, not after it: leaving band mode
        // otherwise leaves the last session's figure on a pane that is no longer
        // in that mode, and this surface exists to be read at a console.
        pane.deliveryMs = null
        delivered = null
        if (mode !== 'band') return

        const started = performance.now()
        let announce
        delivered = new Promise((done) => { announce = done })
        watcher = new IntersectionObserver(
          (entries) => {
            if (pane.deliveryMs === null) pane.deliveryMs = since(started)
            for (const entry of entries) {
              if (entry.isIntersecting) wanted.add(/** @type {PageWrapper} */ (entry.target))
              else wanted.delete(/** @type {PageWrapper} */ (entry.target))
            }
            announce()
            drain(false)
          },
          { root: pages, rootMargin: '100% 0px' }
        )
        for (const wrapper of pages.children) watcher.observe(wrapper)
      }

      // Whether this page holds the raster the pane wants: the right document,
      // and the right width. See `docGen` for why it is both.
      /** @param {PageWrapper} wrapper */
      function fresh(wrapper) {
        const canvas = /** @type {PaneCanvas} */ (wrapper.querySelector('canvas'))
        return (
          canvas !== null &&
          canvas.gen === docGen &&
          canvas.width === Math.floor(wrapper.logical.w * window.devicePixelRatio)
        )
      }

      // Give a canvas's memory back. **Zeroing is the release** — dropping the
      // element leaves the backing store to a collector with no idea how much it
      // is holding — and the vendored bundle does exactly this for the same
      // reason. It answers false so a superseded render can `return drop(…)`.
      /** @param {HTMLCanvasElement} canvas */
      function drop(canvas) {
        canvas.width = 0
        canvas.height = 0
        pane.released++
        return false
      }

      // A page back to a placeholder. Its two layers go with its canvas, which
      // is what keeps a selection to the pages the pane is actually holding.
      /** @param {PageWrapper} wrapper */
      function release(wrapper) {
        const canvas = wrapper.querySelector('canvas')
        if (canvas === null) return
        drop(canvas)
        wrapper.replaceChildren()
      }

      /*
        Let go of every page the reader is no longer near.

        **After every page drawn, and once more as the pass ends** — either alone
        leaks. A page dropped from the set while its own render is in flight has
        no canvas to release at that moment, and the observer reports only what
        changed, so nothing would ever revisit it; and a set that shrank with
        nothing left to draw never reaches the per-page sweep at all.
      */
      function sweep() {
        if (mode !== 'band') return
        /*
          **An observer that has not delivered yet reports an empty set, and that
          is not the same as nothing being near.** Sweeping on it releases the
          whole document — every page at once, to bare paper — which is what a
          forced pass that ran before the first delivery used to do at every
          width rest. The wait in `refill` is the fix; this is the guard that
          makes the failure unreachable rather than merely unlikely.
        */
        if (wanted.size === 0 && pages.children.length > 0) return
        for (const wrapper of pages.children) {
          if (!wanted.has(wrapper)) release(wrapper)
        }
      }

      /*
        Draw one page — its raster and both its layers, built while they are
        detached and swapped in together.

        **One `replaceChildren` and not an append.** A page element now outlives
        the raster inside it, so appending a layer to a page that already has one
        gives it two. That invariant held only while every render built a new
        page element, and this is the phase that stops it being true.
      */
      /**
       * @param {PageWrapper} wrapper
       * @param {number} seq
       */
      async function paint(wrapper, seq) {
        const from = doc
        const gen = docGen
        const ratio = window.devicePixelRatio

        const page = await from.getPage(wrapper.number)
        if (seq !== renderSeq || from !== doc) return false

        const viewport = wrapper.view
        const canvas = /** @type {PaneCanvas} */ (document.createElement('canvas'))
        canvas.width = Math.floor(wrapper.logical.w * ratio)
        canvas.height = Math.floor(wrapper.logical.h * ratio)
        canvas.gen = gen
        pane.made++

        const held = document.createDocumentFragment()
        held.append(canvas)

        const started = performance.now()
        let task
        pane.renders++
        try {
          task = page.render({
            canvas,
            viewport,
            transform: [ratio, 0, 0, ratio, 0, 0]
          })
          inflight.add(task)
          await task.promise
          pane.renderMs = since(started)
          if (seq !== renderSeq || from !== doc) return drop(canvas)

          await drawLayers(held, page, viewport, seq)
          if (seq !== renderSeq || from !== doc) return drop(canvas)
        } catch (problem) {
          /*
            **A canvas this pass made must be given back however the pass ends**,
            and a cancellation is the ordinary way it ends. Nothing else will:
            the canvas never reached the page, so no sweep and no release can
            reach it, and the pane's own count of what it has made against what
            it has released — which is the only exact measure of what is held
            outside `#pages` — would drift by one per cancelled render.
          */
          drop(canvas)
          throw problem
        } finally {
          if (task) inflight.delete(task)
        }

        const old = wrapper.querySelector('canvas')
        if (old) drop(old)
        wrapper.replaceChildren(held)
        return true
      }

      /*
        Draw what the pane should be holding and is not, and let the rest go.

        **One pass at a time**, and a flag is what makes that true: naming one
        function does not stop two invocations of it overlapping, and two would
        race over the same pages and the same set.

        **The rest is re-checked before every page, not at the top of the pass.**
        Checked at entry alone it does nothing under a throw — the re-entries are
        refused while the pass already running draws every page the reader is
        flying past. A forty-one-frame throw costs five renders this way and
        forty-three the other.

        **`force` is the open and the width rest, and it suppresses that check at
        entry *and* at every page.** Suppressed at entry alone, the open's own
        `scrollTop` write fires a scroll event and stops the forced pass at its
        second page. A programmatic scroll cannot be told from a reader's by a
        flag — the event outruns any flag cleared on a microtask — so following a
        link waits out one rest, which is accepted rather than fixed.

        Cosmetic, so it swallows what it fails at, exactly as `rerender` does: a
        cancelled task rejects here with no awaiter to reject into, and the pages
        this pass did not reach keep the placeholder they had.
      */
      async function drain(force) {
        if (draining) {
          if (force) pending = true
          return
        }
        if (moving && !force) return

        draining = true
        const seq = renderSeq
        try {
          for (;;) {
            if (moving && !force) break
            if (seq !== renderSeq) break

            const holding = mode === 'band' ? [...wanted] : [...pages.children]
            const next = holding.find((wrapper) => !fresh(wrapper))
            if (!next) break

            if (!(await paint(next, seq))) break
            sweep()
          }
        } catch {
          // See above. A rest, a re-open or `clear` is what cancels these.
        } finally {
          sweep()
          draining = false
          if (pending) {
            pending = false
            drain(true)
          }
        }
      }

      /*
        Decide what to hold, watch for it, and fill it in — the tail of an open
        and of a width rest alike.

        **The delivery, or three frames, whichever comes first — and one frame
        is not enough.** An observer's records are computed after the animation
        frame callbacks of the same rendering turn and delivered in a task of
        their own, while the continuation of an awaited `requestAnimationFrame`
        is a microtask of that same callback. So a single frame *always* resumes
        before the first delivery, leaving the forced pass to read an empty set,
        draw nothing, and — before the guard in `sweep` — release the whole
        document to bare paper for the length of a scroll rest, at every width
        rest and every recompile.

        **But it is raced against a frame count rather than awaited**, which is
        the hazard the single frame was reaching for: a promise settled only
        inside the callback never settles at all if the observer is disconnected
        before it delivers, and awaiting it alone would strand this caller and
        defer every future width rest for the life of the window.
      */
      async function refill(seq) {
        decideMode()
        watch()
        await Promise.race([delivered ?? frames(1), frames(3)])
        if (seq !== renderSeq) return
        await drain(true)
      }

      // `n` animation frames, as a promise.
      const frames = (n) =>
        new Promise((done) => {
          const step = () => (--n <= 0 ? done() : requestAnimationFrame(step))
          requestAnimationFrame(step)
        })

      /*
        A scroll ends on nothing, so a timer is what gives it an end — the same
        shape as `settle`'s and shorter, because a scroll stops more often than a
        drag does. This is the only thing that arms an unforced pass besides the
        observer's own delivery.
      */
      pages.addEventListener(
        'scroll',
        () => {
          moving = true
          clearTimeout(resting)
          resting = setTimeout(() => {
            moving = false
            drain(false)
          }, REST)
        },
        { passive: true }
      )

      /*
        **The two things the raster is not.** A canvas is a picture of a page,
        and a PDF carries two properties of the page itself that a picture
        loses: the text is words rather than shapes, and a link is a live
        annotation. `mpdf-003` chose a real PDF view for exactly those, and
        Phase 1 took them away with it. These are them, put back.

        **The text never comes off `getTextContent`, and this is the trap.**
        That call is a `for await (… of readableStream)` over its own stream,
        and `ReadableStream.prototype[Symbol.asyncIterator]` is `undefined` in
        WKWebView — Chromium and Gecko implement async iteration of a readable
        stream and WebKit does not. It rejects with "undefined is not a
        function" from inside the minified bundle, which names nothing useful.
        `TextLayer` takes the stream itself and drives it with `getReader()`
        and `read()`, so handing it `streamTextContent()` obeys the rule by
        construction rather than by remembering it.

        **Only a link carrying an internal destination is rendered.** An
        external one has no element, no `href` and nothing to activate, so
        "refused" is something a second person can check in the inspector
        rather than a behaviour observed not to happen. `mpdf-003` §1.1 is the
        reason: no servers, no network, ever. The filter takes a third class
        with it without needing a second rule — a markdown link *with text*
        pointing at a figure is an ordinary link, reaches the PDF as a `/URI`,
        and `pdf.js` refuses it on its protocol, so it arrives with `url` and
        `dest` both null.

        **The annotation layer takes the viewport unflipped** where the text
        layer takes it as it was drawn. That is what `pdf.js`'s own viewer
        does.

        Both are built into the fragment the raster is being built in, and
        swapped onto the page with it. That is available because nothing here
        reads layout — `TextLayer` measures against an offscreen 2D context and
        `setLayerDimensions` only writes styles — and it is now required rather
        than merely cheap: a page element outlives the raster inside it, so a
        layer appended to the page itself would join the one already there
        instead of replacing it. Every await re-checks that a newer render has
        not superseded this one, exactly as the loop around it does.
      */
      /**
       * @param {DocumentFragment} held
       * @param {PDFPageProxy} page
       * @param {PageViewport} viewport
       * @param {number} seq
       */
      async function drawLayers(held, page, viewport, seq) {
        const words = document.createElement('div')
        words.className = 'textLayer'
        held.append(words)
        await new pdfjs.TextLayer({
          textContentSource: page.streamTextContent(),
          container: words,
          viewport
        }).render()
        if (seq !== renderSeq) return

        const found = await page.getAnnotations({ intent: 'display' })
        if (seq !== renderSeq) return

        const links = document.createElement('div')
        links.className = 'annotationLayer'
        held.append(links)
        // The vendored declarations require fields `pdf.js` tolerates the
        // absence of at runtime, and `linkService` is a duck type of three
        // methods rather than an `IPDFLinkService`. Both are deliberate, and
        // both are older than this check.
        await new pdfjs.AnnotationLayer(/** @type {any} */ ({
          div: links,
          page,
          viewport: viewport.clone({ dontFlip: true }),
          linkService
        })).render(/** @type {any} */ ({
          annotations: found.filter(
            (link) =>
              link.annotationType === pdfjs.AnnotationType.LINK &&
              link.dest != null
          )
        }))
      }

      /*
        What `pdf.js` asks a viewer for when it renders a link, written here
        rather than ported. **`SimpleLinkService` is not in the bundle** — it
        ships in `pdfjs-dist/web/pdf_viewer.mjs`, which this project does not
        vendor — and its route puts a real `href` on the `<a>`, which in this
        window would navigate the webview off `tauri://localhost` with nothing
        to come back with.

        **An internal destination is already something this app reaches**: it
        scrolls the pages container, which is what the reader's anchor does.
        So the element gets a fragment and the click is answered here.
      */
      const linkService = {
        /*
          Never followed — `pdf.js` binds a handler that returns false — and a
          fragment rather than a URL so that a click which escaped that
          handler still could not leave the origin. `getAnchorUrl` is for the
          annotation kinds the filter above does not expect to see.
        */
        getDestinationHash: () => '#',
        getAnchorUrl: () => '#',

        async goToDestination(dest) {
          const from = doc
          if (from === null) return

          const explicit =
            typeof dest === 'string' ? await from.getDestination(dest) : dest
          if (!Array.isArray(explicit) || explicit.length === 0) return

          // A destination names its page by reference; some name it by index
          // instead, and both are cheap to accept.
          const index =
            typeof explicit[0] === 'number'
              ? explicit[0]
              : await from.getPageIndex(explicit[0])
          if (from !== doc) return // the document changed under the await

          const wrapper = pages.children[index]
          if (!wrapper) return

          /*
            **The destination's own coordinate, not the top of its page.** The
            kinds that carry one carry it in PDF units up from the page's
            bottom edge, so the page's own viewport is what turns it into the
            CSS offset this container scrolls in. The ratio is 1 at rest and
            the gesture's factor while a width is still moving, which is the
            same quantity `readAnchor` works in and for the same reason.
          */
          const top = destinationTop(explicit)
          const y =
            top === null ? 0 : wrapper.view.convertToViewportPoint(0, top)[1]
          const scale = wrapper.offsetHeight / wrapper.logical.h
          pages.scrollTop = wrapper.offsetTop + Math.max(y, 0) * scale
        }
      }

      // How far up its page a destination points, in the page's own units, or
      // null for the kinds that name a whole page and nothing in it — and for
      // an `XYZ` that leaves its coordinate open, which means "stay".
      function destinationTop(dest) {
        switch (dest[1]?.name) {
          case 'XYZ':
            return dest[3] ?? null
          case 'FitH':
          case 'FitBH':
            return dest[2] ?? null
          case 'FitR':
            return dest[5] ?? null
          default:
            return null
        }
      }

      /*
        A refusal that is not a compile status: an open that would not read, or
        an export the pane cannot serve. It reaches the page in Rust's own
        words, in the bar the compile error uses, and the next compile's status
        replaces it.

        The last good page survives it, here as everywhere. An author mid-edit
        passes through broken states constantly — a half-typed table, a fence
        not yet closed — and blanking the pane on each one would lose their
        place.
      */
      function fail(problem) {
        error.textContent = String(problem)
        error.hidden = false

        const drawing = !pages.hidden
        error.classList.toggle('alone', !drawing)
        message.hidden = true
        if (drawing) pages.classList.add('stale')
      }

      // Back to the empty state, holding no document's page, no text and no
      // project. The panel goes with them: it is drawn for every open document
      // now, so the previous project's files would otherwise stay on screen
      // through the open that replaces them.
      function clear() {
        hideAsset()
        files.hidden = true
        toggle.hidden = true
        list.replaceChildren()
        // The field and its refusal go too, and that is the reason they sit
        // outside `#parts` read backwards: nothing else in this function
        // touches them, so a path typed for one project and a refusal raised in
        // it would both survive the Open into the next.
        nameFile(false)
        message.hidden = false
        divergence.hidden = true
        error.hidden = true
        status.textContent = ''
        status.className = ''
        text.value = ''
        text.disabled = true
        relines()
        renderSeq++
        cancelRenders()
        watcher?.disconnect()
        watcher = null
        wanted.clear()
        mode = 'whole'
        pane.mode = mode
        pages.hidden = true
        pages.classList.remove('stale')
        // Every page gives its raster back on the way out. Dropping the elements
        // alone would leave the backing stores to a collector, and the pane's own
        // count of what it has made and released would stop being checkable.
        for (const wrapper of pages.children) release(wrapper)
        pages.replaceChildren()
        loading?.destroy()
        loading = null
        doc = null
        fitted = null
        anchor = null
        /*
          **An open resets the fit to fit-to-width**, control and all. An open
          is not a zoom request, which is OQ-2 case 1's argument about the
          reader's place made about the reader's scale; and every path that
          opens a document — the dialog, the menu, and a file Finder handed
          over — comes through here.
        */
        fitMode = 'width'
        fitScale = 1
        fitControl.value = 'width'
        tellFit()
        pane.scale = null
        drawnRevision = -1
        takenReload = -1
      }

      /*
        **A gesture is carried by CSS size; a rest is answered by a render.**

        A width that is moving cannot be answered by re-rendering. The
        divider's drag sets a flex basis on every `pointermove`, six pages cost
        some 94 ms against a frame's 16.7 ms, and every render would be
        cancelled by the next — so nothing would complete until the hand came
        off, and a cancelled render on a just-resized canvas leaves it cleared.
        The literal reading blanks the pane through the drag.

        So while a width is changing the pages are resized by CSS — their
        canvases' backing stores untouched and the browser resampling bitmaps
        it already has, their two layers following by one custom property; when
        the width rests they are re-rendered at the new scale, which is sharp
        because the raster is made for that width. The cost of a step is a
        relayout and a repaint, far under what a render costs, which is what
        the gesture exists to avoid.

        **The rest costs nothing it used to.** A redraw through WebKit could
        not restore the reader's place, because that view leaks none; a
        renderer this project owns re-rasterises into canvases it already
        positions, so a rest is the same page at the same place in it, sharper.

        **The fits do not add a third half to this.** A fit change *is* a
        rest: nothing about it is continuous, so it goes straight to the
        render and the gesture half never runs for it. What the fits change is
        which gestures the CSS half carries at all — see `fit()`.
      */

      /*
        **The scale the raster now on the pages was made for** — the fit's own
        derivation, unrounded, as `layoutPages` computed it. Null when nothing
        is drawn, which is the only time there is nothing to hold.

        **It was the pane's width until the fits arrived**, and the
        generalisation is the whole mechanism of the zoom: a width is the
        right thing to compare only while width is the one input. Recovering
        it from the rounded CSS box as `logical.w / natural.w` is not the
        same number and is not an option — it never equals a fit-page
        derivation, so every rest would re-lay the document out for nothing.
      */
      let fitted = null

      /*
        **The fit is the pane's state, and the word is "fit" and never
        "mode".** `mode`, `decideMode` and `__pane.mode` are already bound in
        this file to Phase 5's whole-or-band retention, which is a different
        question about the same pane; a second `mode` here would hand a reader
        the wrong variable at the first grep.

        What moves re-derives under `width` and `page` and is held under
        `manual`. **Fit-to-width is the default**, because it is what the pane
        has always approximated and what an author writing to a page width
        wants, and `clear()` puts it back — an open is not a zoom request, the
        same argument as OQ-2's case 1 makes about the reader's place.
      */
      let fitMode = 'width'
      let fitScale = 1

      /*
        The two things every change of fit must do besides changing it: publish
        it for the gate, and open the horizontal axis if this is the fit that
        can cross it. One writer, so the class cannot drift from the state it
        is meant to be a rendering of.
      */
      function tellFit() {
        pane.fit = fitMode
        pages.classList.toggle('wide', fitMode === 'manual')
      }
      tellFit()

      /*
        **The one place each fit's expression is written.** Everything
        downstream — the CSS box, `--total-scale-factor`, the backing store,
        the reader's anchor, the budget — follows from the viewport this
        produces, so there is exactly one of them per fit and no case analysis
        anywhere else.

        **The pane is passed in rather than read here**, so one layout pass
        chooses every page's scale from one measurement of the box. That
        matters on the one axis that can move under it: a pinned scale wider
        than the pane raises a horizontal track, which takes ~15 px out of
        `clientHeight` — harmless, because the fit that reads the height is
        the fit that never overflows sideways, and worth not relying on twice.
      */
      /**
       * @param {Size} natural
       * @param {Room} room
       */
      function scaleFor(natural, room) {
        if (fitMode === 'manual') return fitScale
        const byWidth = room.width / natural.w
        if (fitMode === 'page' && room.height > 0) {
          return Math.min(byWidth, room.height / natural.h)
        }
        return byWidth
      }

      /*
        The scale the fit derives *right now* for the pages on screen — what
        `fitted` is compared against, and the generalisation of the width
        comparison this file used to make. Null when the pane holds no page,
        which the two callers are careful to tell from a scale that has not
        moved.
      */
      function derived() {
        const first = pages.children[0]
        return first ? scaleFor(first.natural, box()) : null
      }

      /*
        Where the reader is, taken when a gesture starts and held until the
        render that ends it: a page index and a fraction within that page.

        **Not a pixel offset.** The scale changes with the width, so every
        page's height and the container's `scrollHeight` change with it — an
        offset held across that moves the reader, and clamps at the bottom when
        a pane widens and then narrows. An index and a fraction survive both a
        scale change and a document that gained a page.

        **Non-null is what "a gesture is open" means**, which is why nothing
        here keys on `pointerdown`: a window drag-resize has no pointer event
        to mark a start, and neither a control taking width out of the column
        nor the fit control itself has one. A derived scale differing from
        `fitted` opens a gesture; one arriving while a gesture is open
        continues it.
      */
      let anchor = null

      // What the pages have to fill. The container's own box, not the column's
      // — it is a flex child, so the bars above it are already out of its
      // height, and its content box is already less whatever scrollbar track
      // the machine reserves.
      function box() {
        return { width: pages.clientWidth, height: pages.clientHeight }
      }

      /*
        A page's CSS size is its logical size times the gesture's scale.

        **Which property carries a gesture is a decision and not a style.** A
        transform leaves layout alone, so the container's `scrollHeight` would
        hold its pre-gesture extent and the anchor above would be read against
        a stale one. CSS width makes the extent track the gesture — and makes
        the backing store and the CSS size diverge during one and agree again
        at rest, so a rest that never came is visible.

        **This is also the one place `--total-scale-factor` is written**, which
        is what carries the two layers through a gesture without either of them
        knowing one is happening: `fit`, `unscale` and the render all delegate
        here, so a gesture and a rest agree by construction rather than by two
        functions being kept in step. A gesture produces no new viewport, so a
        layer positioned from the render's would have stayed at the old size
        through every drag; one CSS property moves every layer box and every
        span with the page.

        **The value is absolute** — the box's current CSS width over the page's
        *unscaled* width, `setLayerDimensions` multiplying `rawDims.pageWidth`
        by it. Anything relative is wrong by the render scale at every width:
        `1` would put a 595 px layer over a 535 px page, every span and every
        annotation rect overhanging by 11%, most of it clipped rather than
        visible. Written as the one expression it needs no case analysis, which
        is the argument for writing it that way.
      */
      /**
       * @param {PageWrapper} page
       * @param {number} scale
       */
      function size(page, scale) {
        const width = page.logical.w * scale
        page.style.width = `${width}px`
        page.style.height = `${page.logical.h * scale}px`
        // A number where the IDL says string, which WebIDL stringifies on the
        // way in. It has always been written this way, and the declaration has
        // no way to say so.
        page.style.setProperty(
          '--total-scale-factor',
          /** @type {any} */ (width / page.natural.w)
        )
      }

      /*
        **A gesture is carried by CSS size so a page can track a moving pane,
        and only the width fit has a page that should track it.** Under
        fit-page the scale is height-bound wherever the two fits differ, and
        under manual it is pinned by the reader; in both the page keeps its
        size through the drag and the rest settles anything the width did
        change. Below fit-page's boundary that fit *is* width-bound, so there
        a drag holds the page at its old size until the rest snaps it —
        **the accepted cost of one rule rather than three**, and the reason
        the guard is here rather than at the two call sites.

        **The factor is read per page, not once for the list.** They are
        normally all made for the same width, so this is one ratio for every
        one of them — but a compile landing mid-gesture swaps its pages in one
        at a time, and for those few frames the list holds rasters from two
        different widths. Each page carries the size its own raster was made
        for, so each one lands at the container's width regardless.
      */
      function fit() {
        if (fitMode !== 'width') return
        const width = box().width
        if (!(width > 0)) return
        for (const page of pages.children) {
          size(page, width / page.logical.w)
        }
      }

      /*
        Back to the size the raster was made for. It **writes** the logical
        size rather than clearing it: a page with no CSS size takes the
        container's whole width and no height at all, and the canvas inside it,
        being sized from that box, follows it to nothing.
      */
      function unscale() {
        for (const page of pages.children) size(page, 1)
      }

      // Which page the container is scrolled into, and how far through it.
      /** @returns {Place | null} */
      function readAnchor() {
        const kids = pages.children
        if (kids.length === 0) return null

        const top = pages.scrollTop
        let i = kids.length - 1
        for (let k = 0; k < kids.length; k++) {
          if (kids[k].offsetTop + kids[k].offsetHeight > top) {
            i = k
            break
          }
        }
        const height = kids[i].offsetHeight || 1
        return { page: i, fraction: (top - kids[i].offsetTop) / height }
      }

      /** @param {Place | null} at */
      function applyAnchor(at) {
        const kids = pages.children
        if (at === null || kids.length === 0) return
        const i = Math.min(at.page, kids.length - 1)
        pages.scrollTop = kids[i].offsetTop + at.fraction * kids[i].offsetHeight
      }

      /*
        Draw the pages again at the width they ended up with, and put the
        reader back where the gesture started.

        It draws from the retained document and invokes nothing.

        **Skipped when the scale the fit now derives is the scale the layout
        already holds**, and that comparison is the phase's whole mechanism.
        It was a width, correct only while width was the one input; as a scale
        it answers four cases with one expression. A window resized by its
        height alone still costs nothing under fit-to-width. A height-only
        resize under fit-page *does* re-derive, which a width comparison could
        never have noticed, so the page goes on fitting the pane. A width rest
        under a pinned scale derives the same pinned number and costs nothing,
        which is what "the reader asked for 400%" means. And **a fit change
        passes this guard on its own**, because the derived scale moved while
        the width did not — which is why the control's whole path is to set
        the fit, take the anchor, and call this.

        A null derivation is not a scale that failed to move: it means the
        pane holds no page to derive against, and a layout that could not
        measure the pane leaves `fitted` null too. Skipping there would refuse
        the render meant to fix it, for the life of the window.

        This is also where a gesture that never changed anything is closed.

        Cosmetic, so it swallows what it fails at: the pages keep the size the
        gesture left them at, soft rather than absent, and the next compile
        re-renders them anyway.
      */
      async function rerender() {
        if (pages.hidden || doc === null) return
        const now = derived()
        if (now !== null && now === fitted) {
          anchor = null
          return
        }

        /*
          **A rest never cancels a render that is still running.** On an open
          the pane is unhidden, which is a resize, which arms this timer — so
          it can come due while the first render is still drawing. Cancelling
          there would leave the pane empty and `fitted` unset, and the render
          that was going to fix it is the one just cancelled. The width is
          still wrong, so the timer is re-armed and this returns to it.
        */
        if (rendering > 0) {
          settle()
          return
        }

        const seq = ++renderSeq
        cancelRenders()
        try {
          if (!(await renderPages(seq))) return
        } catch {
          return // left scaled, deliberately. See above.
        }
        applyAnchor(anchor)
        anchor = null

        // The scale moved, so what the pane can afford to hold moved with it —
        // by the square of it, when a fit change is what moved it. This is the
        // second and third of the three passes that re-decide the budget, and
        // the reader is back where they were before it does.
        await refill(seq)
      }

      /*
        A drag ends on an event and a window resize does not, so the timer is
        what gives the second one an end. It is not the compile's debounce —
        nothing about the document turns on it, and it only decides when a
        picture is drawn again.
      */
      /** @type {ReturnType<typeof setTimeout> | null} */
      let settling = null
      const settle = () => {
        clearTimeout(settling)
        settling = setTimeout(() => {
          rerender()
          relines()
        }, 200)
      }

      /*
        **What the page watches is the pane, not the events that resize it.**

        A window resize is one cause among several and it was the only one
        wired: folding the section panel, and showing the line gutter, both
        take their width out of this column. Listing the causes is how that bug
        happened twice, and the next control added to the row would have
        reintroduced it. The rule outlived the renderer it was found in.

        **The anchor is read before `fit` reflows.** The pages still hold
        their pre-gesture CSS size at this point, so this is where the reader
        actually was. Resizing by CSS reflows, so a gesture of factor `s` maps
        a content offset `T` to `T·s` while the browser holds `scrollTop` at
        `T` — the reader is displaced continuously through the drag unless the
        anchor is put back on every step, and WebKit implements no scroll
        anchoring that would compensate.

        **What opens a gesture is the derived scale against the held one**,
        `rerender`'s own comparison, so the two agree by construction. It is
        read here even under the fits `fit()` declines to carry: the anchor
        must be taken before the layout the rest is about to run, and a
        height-only resize under fit-page reaches that layout by this path and
        no other.
      */
      new ResizeObserver(() => {
        if (!pages.hidden && fitted !== null && derived() !== fitted) {
          if (anchor === null) anchor = readAnchor()
          fit()
          applyAnchor(anchor)
        }
        settle()
      }).observe(pages)

      /*
        Number the lines the buffer has.

        **A row is as tall as its line renders.** A textarea soft-wraps, so one
        logical line can occupy three rows on screen, and a gutter that gave
        every number one line-height would drift further out of true with every
        wrap until the numbers meant nothing. There is no way to ask a textarea
        where its wraps fell, so the heights are measured off a mirror: the same
        text, the same font, laid out at the same content width, one element per
        logical line. What the browser does to the mirror is what it did to the
        textarea.

        **An empty logical line is mirrored as a zero-width space**, and markdown
        is mostly blank lines. The failure without it **accumulates** rather than
        costing one row its height: `rows` is a running sum over the measured
        heights, so every blank line above a row shifts that row by one line
        more than the blank line before it did.

        Rebuilt when the text changes or the width does, and skipped when
        neither has. **The width-change rebuild rides `settle`'s 200 ms timer**,
        not a `pointermove` and not the `pointerup` itself: the measurement is a
        layout, and a layout per frame for a column of numbers nobody is reading
        mid-drag is waste.
      */
      const lines = document.getElementById('lines')
      const mirror = document.getElementById('mirror')
      const numbers = document.getElementById('numbers')

      // What the gutter was last built for, so an event that changed neither
      // costs nothing.
      let linedText = null
      let linedWidth = null

      // Where each row starts, plus the heights beside it. Null until measured.
      /** @type {Rows | null} */
      let rows = null

      // Which gutter row currently wears the mark, so clearing it is one
      // element rather than a walk.
      let marked = -1

      function relines() {
        if (lines.hidden) return

        const style = getComputedStyle(text)
        const width =
          text.clientWidth -
          parseFloat(style.paddingLeft) -
          parseFloat(style.paddingRight)

        if (text.value === linedText && width === linedWidth) return
        linedText = text.value
        linedWidth = width

        if (text.value === '') {
          lines.replaceChildren()
          rows = null
          marked = -1
          // And the band with them. `clear()` reaches here, and this is the
          // only path to it: the two other callers of `markLine` need a
          // focused, enabled textarea, which a cleared pane is not. Without
          // this the previous document's band stays painted across an empty
          // one until something opens.
          markLine()
          return
        }

        mirror.style.width = `${width}px`
        mirror.replaceChildren(
          ...text.value.split('\n').map((line) => {
            const row = document.createElement('div')
            // An empty line still occupies one, and an empty element does not.
            row.textContent = line === '' ? '\u200b' : line
            return row
          })
        )

        // One read of the whole mirror, then one write of the whole gutter.
        const heights = Array.from(
          /** @type {HTMLCollectionOf<HTMLElement>} */ (mirror.children),
          (row) => row.offsetHeight
        )
        lines.replaceChildren(
          ...heights.map((height, i) => {
            const row = document.createElement('div')
            row.style.height = `${height}px`
            row.textContent = String(i + 1)
            return row
          })
        )

        // Kept for the band, which needs where each row starts and how tall it
        // is — the same measurement, so it is taken once and read twice.
        rows = /** @type {Rows} */ (heights.reduce(
          (at, height) => (at.push(at[at.length - 1] + height), at),
          [0]
        ))
        rows.heights = heights
        marked = -1 // the rows above are new elements; none of them wears it

        lines.scrollTop = text.scrollTop
        markLine()
      }

      /*
        The line the caret is in, marked twice: its number in the gutter, and a
        band behind the line itself.

        The line is counted the way `caretPage` counts it, off `selectionStart`,
        because a second way of finding the caret's line would be a second thing
        that can disagree with the page the pane opens on — and the disagreement
        would be invisible until it was not.

        Only in Lines mode. The band is placed from the measured rows, and the
        rows are only measured when the gutter is drawing them — so the mode
        that pays for the measurement is the mode that gets the band.
      */
      function markLine() {
        if (lines.hidden || rows === null || text.value === '') {
          text.style.backgroundImage = ''
          return
        }

        const line = text.value.slice(0, text.selectionStart).split('\n').length
        const i = Math.min(line - 1, rows.heights.length - 1)

        // Only the two rows that change. Walking the gutter to clear it would
        // be a pass over every line in the document on every arrow key.
        if (marked !== i) {
          lines.children[marked]?.classList.remove('here')
          lines.children[i]?.classList.add('here')
          marked = i
        }

        // Placed from the padding box, which is where a background starts, so
        // the pane's own top padding is added to the row's offset.
        const top = parseFloat(getComputedStyle(text).paddingTop) + rows[i]
        text.style.backgroundImage =
          'linear-gradient(var(--band), var(--band))'
        text.style.backgroundSize = `100% ${rows.heights[i]}px`
        text.style.backgroundPosition = `0 ${top}px`
      }

      /*
        **The gutter does not scroll; it follows.** Its box does not scroll
        itself and its `scrollTop` is driven from the textarea's — here, and
        again whenever the rows are rebuilt. Without this the numbers part
        company with their lines the moment a document is taller than the pane,
        which is every document.

        **The band needs none of it**: `background-attachment: local` scrolls it
        with the text. That is the contrast the two are built around.
      */
      text.addEventListener('scroll', () => {
        lines.scrollTop = text.scrollTop
      })

      // A caret moves without the text changing — an arrow key, a click, a
      // drag — and `relines` returns early on exactly those, so the mark needs
      // its own event rather than a ride on that one.
      document.addEventListener('selectionchange', () => {
        if (document.activeElement === text) markLine()
      })
      text.addEventListener('keyup', markLine)
      text.addEventListener('click', markLine)

      numbers.addEventListener('click', () => {
        const on = numbers.getAttribute('aria-pressed') !== 'true'
        numbers.setAttribute('aria-pressed', String(on))
        lines.hidden = !on
        relines()
        markLine()
      })

      /*
        The fit changed. **The path is the width rest's, unmodified** — set
        the fit, take the anchor, then `rerender`: layout, `applyAnchor`,
        `refill`. It inherits every property that path already has, and each
        one is wanted here. The `rendering > 0` deferral, so a fit changed
        while a compile is drawing re-arms the timer rather than cancelling
        the render that is about to set the fit. The cosmetic catch, so a
        failure leaves the pages at the size they had rather than absent.
        `refill`, so the budget is re-decided against the new scale and the
        pane goes from whole to band, or back, without a second mechanism.

        **The anchor is read before the layout, and that is what carries the
        reader.** Measured before it was: a reader at page 36, fraction 0.499,
        switching from fit-width to 200% landed on page 16, fraction 0.684.
        `if (anchor === null)` because a fit changed mid-drag must not
        overwrite the place the drag started from.

        It calls `rerender` rather than arming `settle`, because a control is
        an event with an end. `relines()` is not called with it: the gutter is
        measured against the text pane, and no width there moved.
      */
      fitControl.addEventListener('change', () => {
        const chosen = fitControl.value
        if (chosen === 'width' || chosen === 'page') {
          fitMode = chosen
        } else {
          fitMode = 'manual'
          fitScale = Number(chosen)
        }
        tellFit()

        if (anchor === null) anchor = readAnchor()
        rerender()
      })

      /*
        Drag the divider. Nothing is done to the pane for the length of the
        drag any more: the `pointer-events` this used to hang on the frame
        existed to stop WebKit's PDF view swallowing the pointer, and the frame
        is gone.
      */
      const divider = document.getElementById('divider')
      divider.addEventListener('pointerdown', (down) => {
        divider.setPointerCapture(down.pointerId)

        /*
          Where the text pane starts, taken once at the grab. `clientX` is
          measured from the window and the width being set is the pane's own,
          so the two differ by whatever sits to the left — which was nothing
          until the section panel did. Setting one from the other unconverted
          moved the divider to the panel's width the moment it was touched.

          Once per drag rather than once per move: the panel cannot be folded
          while the pointer is held here, so this does not change under the
          drag, and reading layout in a pointermove costs a reflow each time.
        */
        const from = text.getBoundingClientRect().left
        const room = document.body.clientWidth - from

        const move = (at) => {
          const width = Math.min(Math.max(at.clientX - from, 120), room - 160)
          text.style.flexBasis = `${width}px`
          fit()
        }
        const up = () => {
          divider.removeEventListener('pointermove', move)
          divider.removeEventListener('pointerup', up)
          settle()
        }

        divider.addEventListener('pointermove', move)
        divider.addEventListener('pointerup', up)
      })

      // Every change goes to Rust, which holds the buffer and owns the
      // debounce. A debounce in this page would be logic reachable only by
      // typing at the window, and no test could hold it.
      text.addEventListener('input', () => {
        invoke('edit', { text: text.value })
        relines()
      })

      document.getElementById('discard').addEventListener('click', discardEdits)
      document.getElementById('open').addEventListener('click', openDocument)
      document.getElementById('save').addEventListener('click', saveDocument)
      document.getElementById('export').addEventListener('click', exportDocument)
      listen('open', openDocument)
      listen('save', saveDocument)
      listen('export', exportDocument)
      listen('rendered', refresh)
      listen('opened', takePendingOpen)

      /*
        These two run last, and the ordering above them is load-bearing though
        it does not look it: the listens are registered first, so the take below
        sits after the listener rather than before it.

        The limit that accepts, recorded rather than fixed: `listen` completes
        over IPC, so a document landing between this take and the listener's
        actual registration would sit in Rust's slot until the next signal. The
        source ordering makes that window practically unreachable, and the cost
        if it is ever reached is a document that opens late rather than one that
        opens wrong.
      */


      // The launch state is a state like the others, and Rust names it too.
      refresh()

      // And a document Finder handed over before this script existed.
      takePendingOpen()
    </script>
  </body>
</html>
