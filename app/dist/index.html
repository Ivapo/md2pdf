<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>md2pdf</title>
    <style>
      /*
        The whole front end is this one file, plus the two `pdf.js` modules
        vendored beside it. `withGlobalTauri` puts the API on
        `window.__TAURI__` and `pdfjs-dist` ships browser-ready ES modules, so
        there is still no bundler and no npm toolchain here: `frontendDist` is
        a directory of static files, and the app is one Cargo build.
      */
      :root {
        color-scheme: light dark;
        --ground: #f4f4f2;
        --chrome: #e8e8e4;
        --edge: #d5d5cf;
        --ink: #2b3140;
        --quiet: #6b7280;
        --alarm: #a03323;
        --band: #e9e9e4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #1c1f27;
          --chrome: #262a34;
          --edge: #363b47;
          --ink: #e6e6e2;
          --quiet: #9aa1ae;
          --alarm: #e08573;
          --band: #242833;
        }
      }

      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--ground);
        color: var(--ink);
        font:
          13px/1.5 -apple-system,
          system-ui,
          sans-serif;
      }

      header {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 8px 12px;
        background: var(--chrome);
        border-bottom: 1px solid var(--edge);
      }
      button {
        font: inherit;
        color: inherit;
        padding: 4px 14px;
        border: 1px solid var(--edge);
        border-radius: 6px;
        background: var(--ground);
      }
      button:active {
        background: var(--edge);
      }

      /*
        The status line. Every word in it is chosen in Rust and this only
        places it, so the four states are checked by tests rather than by eye.
        The class is the state's own name, so the colour follows the word.
      */
      #status {
        margin-left: auto;
        color: var(--quiet);
        font-variant-numeric: tabular-nums;
      }
      #status.stale,
      #status.failed {
        color: var(--alarm);
      }

      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      /*
        The section panel. It lists the parts of the open document: the master
        first, then the sections it names in the order it reads them, each
        named as the master writes it — `sections/method.md` and not
        `method.md`, because that is the master's own word for it, it is what
        the author would edit, and two sections of the same name in different
        folders must not read alike. A document naming no section draws no
        panel at all, so a single-file window is unchanged.

        **A left column, before the text pane, and the placement is
        load-bearing rather than taste.** It is the panel `mpdf-003` Phase 7
        records two geometry bugs against: the divider read `clientX`, measured
        from the window, which matched the pane's own width until this sat to
        the left of it. `#divider` takes its grab point from the text pane's
        own left edge because of this element.

        **The rows do not load, and that is decided rather than deferred.**
        Loading a section into the pane breaks "the pane holds exactly one
        file", and four things turn on it: `render_with` keeps only the anchors
        whose location names no file, `Session::on_change` runs the
        external-change rule on the buffer the pane holds and never on a
        section, `save` writes to the document's own path, and the join reads
        every section off the disk. A phase that wants loading rows inverts the
        first, forks the second, redirects the third and makes the fourth take
        one file's text from memory — which is a phase, not a detail. So the
        rows are a list and are deliberately not dressed as buttons.

        `mpdf-008` Phase 4.
      */
      #files {
        flex: 0 0 auto;
        min-width: 0;
        max-width: 40%;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 10px 0;
        background: var(--chrome);
        border-right: 1px solid var(--edge);
      }
      #files[hidden] {
        display: none;
      }
      /*
        Collapsed is not hidden, and the two are different states. A document
        naming no section has no panel and no toggle — `hidden`. A document that
        has one the reader has folded away keeps its toggle — `.collapsed`.
      */
      #files.collapsed {
        display: none;
      }

      /*
        The toggle. Leftmost in the header because it works the leftmost pane,
        and text rather than an icon because every other control here is text.
        The chevron turns; it does not redraw.
      */
      #toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      #toggle[hidden] {
        display: none;
      }
      #toggle::before {
        content: '';
        width: 0;
        height: 0;
        border: 4px solid transparent;
        border-left-color: currentColor;
        border-right: 0;
        transform-origin: 25% 50%;
        transition: transform 120ms ease;
      }
      #toggle[aria-expanded='true']::before {
        transform: rotate(90deg);
      }
      #files h2 {
        margin: 0 0 6px;
        padding: 0 12px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--quiet);
      }
      #files ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #files li {
        padding: 4px 12px;
        white-space: nowrap;
        color: var(--quiet);
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      /* The one the pane is actually holding. */
      #files li.here {
        color: var(--ink);
        box-shadow: inset 2px 0 0 var(--ink);
      }

      /*
        The line gutter. A view and nothing else: it numbers the lines the
        buffer already has and changes not one byte of it.

        **What it is *not* is a second editor**, and that is the decision the
        rest depends on. The textarea stays the editor, so the buffer sent to
        `edit`, the reload that replaces `value`, `caretPage`'s
        `selectionStart`, the disabled state and the divider's geometry all keep
        the single implementation they have — none of which any test in this
        repository reaches. A code editor component would fork every one of
        them and would need a bundler besides, which is the thing
        `withGlobalTauri` exists to avoid.

        **A row is as tall as its line renders, not one line-height**, because a
        soft-wrapped paragraph occupies several rows on screen and a gutter that
        assumed otherwise would drift a number further out of true with every
        wrap. The heights come off a hidden mirror of the text laid out at the
        pane's own width; `relines` argues it.

        **`overflow: hidden` here is half of a pair rather than tidiness.** This
        box does not scroll itself; its `scrollTop` is driven from the
        textarea's, by `relines` and by the `scroll` listener below. The band
        takes the other route entirely — `background-attachment: local` — and
        that contrast is why the two are built differently.

        `mpdf-003` Phase 8.
      */
      #lines {
        flex: none;
        overflow: hidden;
        box-sizing: border-box;
        padding: 12px 8px 12px 12px;
        text-align: right;
        background: var(--chrome);
        border-right: 1px solid var(--edge);
        color: var(--quiet);
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        user-select: none;
        cursor: default;
      }
      #lines[hidden] {
        display: none;
      }
      #lines div {
        /* Set per row from the measured height; this is the unwrapped case. */
        line-height: 1.6;
      }
      /* The row the caret is in. */
      #lines div.here {
        color: var(--ink);
        background: var(--band);
      }

      /* The mirror. Never seen; only measured. */
      #mirror {
        position: absolute;
        top: -99999px;
        left: 0;
        visibility: hidden;
        box-sizing: border-box;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        tab-size: 4;
      }

      /* A view toggle that is on. The panel's chevron turns; this one fills. */
      #numbers[aria-pressed='true'] {
        background: var(--edge);
      }

      /*
        The text pane. A plain textarea and nothing more: no highlighting, no
        autocomplete, no formatting commands. Its text is what compiles — the
        file beside it need never have held that text — and every change is
        sent to Rust, which holds the buffer and owns the debounce.
      */
      #text {
        flex: 0 0 40%;
        min-width: 12ch;
        box-sizing: border-box;
        margin: 0;
        padding: 12px 14px;
        border: 0;
        resize: none;
        background: var(--ground);
        color: var(--ink);
        /*
          The band under the caret's line is painted as this element's own
          background — a gradient of one colour, sized and placed from the
          measured row. **`local` is what makes it scroll with the text**: the
          default would pin it to the border box and it would sit still while
          the lines moved under it.

          **`no-repeat` cost a build.** The gradient is sized to the one
          measured row and a background repeats by default, so without it the
          band tiles down the whole pane and every line wears one.

          A band drawn as an element would need the textarea wrapped, made
          transparent, and layered over — and the divider's geometry, which
          reads this element's own box, would move with it. The background
          costs none of that.
        */
        background-attachment: local;
        background-repeat: no-repeat;
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        tab-size: 4;
      }
      #text:disabled {
        color: var(--quiet);
      }

      /* The divider the reader drags. It is the only chrome between panes. */
      #divider {
        flex: none;
        width: 5px;
        cursor: col-resize;
        background: var(--edge);
      }

      #preview {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        /* The pages scroll in their own container, never in this column. */
        overflow: hidden;
      }

      /*
        The scroll container the pages sit in, and the element every width in
        this file is measured from. **The fit is its `clientWidth`**, not the
        column's: on a machine set to show classic scrollbars its content box
        is some 15 px narrower, which is the difference between a page that
        fits and a page clipped at its right edge.

        `overflow-y: scroll` rather than `auto`, so that width cannot move
        under the fit. With `auto` a document sitting just under the scroll
        threshold gains a scrollbar the moment the canvases widen, the content
        box narrows by the track, and the pages clip.

        `position: relative` makes each canvas's `offsetTop` a measurement
        from this box, which is what the reader's place is read against.
      */
      #pages {
        flex: 1;
        min-width: 0;
        min-height: 0;
        position: relative;
        overflow-y: scroll;
        overflow-x: hidden;
      }
      #pages[hidden] {
        display: none;
      }
      /*
        **A page is separated from the next by 16 CSS pixels, and from the
        container's sides by nothing.** The gap is chrome rather than content,
        so it is a constant: `fit()` and `unscale()` keep writing canvas sizes
        and know nothing about it, and a gap that grew with the page would read
        as part of the document at a large scale and vanish at a small one.

        **A length and not a ratio.** A percentage margin resolves against the
        containing block's *width*, so it would track the divider — at a narrow
        pane the same declaration renders 8–9 px. Sixteen reads as a separation
        at a glance against a page some 535 px wide and costs only scroll
        distance the reader was passing through anyway.

        **`margin-top`, and the property is load-bearing.** `offsetTop`
        includes an element's top margin, so the reader's anchor moves with the
        gap; `#pages` is a block formatting context by virtue of `overflow-y:
        scroll`, so the first canvas's margin does not collapse out of it; and
        only top margins exist, so no pair of siblings collapses to less than
        the constant.

        **Nothing at the sides**, and not merely because the width is wanted
        elsewhere: `clientWidth` *includes* padding, so `box()` would keep
        reporting the padding-box width, the canvases would be sized past the
        content box, and they would clip silently.

        **The hairline is a shadow rather than a border, and rides the top and
        bottom edges only.** A border under `content-box` would make each
        canvas two pixels taller than the height `size()` wrote, and
        `offsetHeight` — which the anchor is expressed in — would stop being the
        raster's own height. A fit-to-width canvas is exactly the container's
        own `clientWidth` wide, so there is no background beside a page to
        separate it from, and an outset ring would spread outside `overflow-x:
        hidden`'s clip either way. `inset` is not the escape: an inset shadow
        paints beneath a replaced element's content, and a canvas is opaque
        white where `pdf.js` filled it. `--edge` is named because a colourless
        `box-shadow` resolves to `currentColor`, which inherits `--ink` — an
        ink ring in light and a near-white one on white paper in dark.
      */
      #pages canvas {
        display: block;
        margin-top: 16px;
        box-shadow: 0 -1px 0 var(--edge), 0 1px 0 var(--edge);
      }
      /*
        The gap below the last page. **A pseudo-element and not a bottom
        margin**, because whether a scroll container's last child's bottom
        margin reaches `scrollHeight` is engine-dependent and this ships on
        WKWebView; `height` and not a margin of its own, so the 16 px is a real
        in-flow border box rather than a margin that may not be counted.

        **And not a spacer element**: `drawPages` indexes `pages.children[n -
        1]` and prunes with `pages.lastElementChild.remove()`, and `fit`,
        `unscale`, `readAnchor` and `applyAnchor` all assume every child is a
        canvas carrying `.logical`. A pseudo-element is in the flow and not in
        `children`, which is exactly the pair of properties wanted.
      */
      #pages::after {
        content: '';
        display: block;
        height: 16px;
      }
      /*
        The mark a stale page wears. A page that belongs to older text than the
        file on disk may not pass for the current one, and the error above it
        says why. No word spells "stale" here: that chrome is Phase 3's.
      */
      #pages.stale {
        opacity: 0.5;
      }

      /* The empty state sits in the same place a page would. */
      #message {
        flex: 1;
        margin: 0;
        padding: 24px;
        white-space: pre-wrap;
        color: var(--quiet);
      }
      /*
        The divergence a refused external change leaves. It is not an error and
        not staleness — nothing failed to compile, and the page belongs to the
        text in the pane. It is the file that has gone elsewhere.
      */
      #divergence {
        flex: none;
        margin: 0;
        padding: 8px 12px;
        background: var(--chrome);
        border-bottom: 1px solid var(--edge);
      }

      /* The error sits above the page it does not belong to. */
      #error {
        flex: none;
        margin: 0;
        padding: 8px 12px;
        white-space: pre-wrap;
        color: var(--alarm);
        background: var(--chrome);
        border-bottom: 1px solid var(--edge);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      /* With no page under it, it takes the whole pane instead. */
      #error.alone {
        flex: 1;
        padding: 24px;
        background: none;
        border-bottom: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <button id="toggle" type="button" aria-expanded="true" aria-controls="files" hidden>
        Sections
      </button>
      <button id="numbers" type="button" aria-pressed="false" aria-controls="lines">
        Lines
      </button>
      <button id="open" type="button">Open…</button>
      <button id="save" type="button">Save</button>
      <button id="export" type="button">Save a Copy…</button>
      <span id="status"></span>
    </header>
    <main>
      <div id="mirror" aria-hidden="true"></div>
      <nav id="files" hidden aria-label="The document's files">
        <h2>Document</h2>
        <ol id="parts"></ol>
      </nav>
      <div id="lines" hidden aria-hidden="true"></div>
      <textarea
        id="text"
        spellcheck="false"
        disabled
        aria-label="The document's markdown"
      ></textarea>
      <div id="divider" role="separator" aria-orientation="vertical"></div>
      <section id="preview">
        <p id="message">Open a markdown file to see its PDF. ⌘O</p>
        <p id="divergence" hidden></p>
        <p id="error" hidden></p>
        <div
        id="pages"
        hidden
        tabindex="0"
        role="region"
        aria-label="The compiled PDF"
      ></div>
      </section>
    </main>

    <script type="module">
      /*
        **`pdf.js` is vendored, not built**: two static ES modules under
        `pdfjs/`, loaded straight from a module script. No npm at build time,
        no bundler, no node — which is the whole of what `withGlobalTauri`
        bought and what this must not spend.

        **The worker is a second file and is not optional.** Parsing and
        rasterisation happen off the main thread, because this pane re-renders
        every time the typing stops and rasterising on the main thread would
        freeze the text the author is typing into.
      */
      import * as pdfjs from './pdfjs/pdf.min.mjs'
      pdfjs.GlobalWorkerOptions.workerSrc =
        new URL('./pdfjs/pdf.worker.min.mjs', import.meta.url).href

      const { open, save } = window.__TAURI__.dialog
      const { invoke } = window.__TAURI__.core
      const { listen } = window.__TAURI__.event

      const pages = document.getElementById('pages')
      const text = document.getElementById('text')
      const message = document.getElementById('message')
      const divergence = document.getElementById('divergence')
      const error = document.getElementById('error')
      const status = document.getElementById('status')

      /*
        The document the canvases were drawn from, held between renders, and
        the loading task it came from.

        **A re-render caused by geometry alone draws from this and asks Rust
        for nothing.** That is not an optimisation: `current_pdf` refuses while
        the preview is stale, so a pane that re-fetched on a resize could not
        re-fit a stale page — which is the case a fit that cannot go stale is
        strongest about.

        **The task is held because it is what can be destroyed.** A
        `PDFDocumentProxy` has no `destroy` of its own; the loading task does,
        and it takes the worker with it. Every open starts a worker, and this
        pane re-opens every time the typing stops, so dropping one without
        destroying it leaks a thread and its copy of the document per compile.
      */
      let loading = null
      let doc = null

      /*
        The generation of the render now wanted, and the tasks the last one
        left running. A render in flight is cancelled before the next begins,
        and every await inside a render checks it is still the wanted one
        before it touches the page.
      */
      let renderSeq = 0
      const inflight = new Set()

      // How many renders are running, so a rest can wait for one rather than
      // cancel it. A count and not a flag: a render being superseded overlaps
      // the one superseding it, and a flag would be cleared by the loser on
      // its way out.
      let rendering = 0

      /*
        What this page has already taken from Rust. Both are counters Rust
        keeps, and both exist to stop this page doing work that would cost the
        reader something.

        `revision` counts compiles that produced bytes: a signal that carries
        no new page must not redraw the frame, because a redraw moves the
        reader off whatever they were looking at and the app's own save now
        compiles nothing at all.

        `reloaded` counts the times Rust replaced the buffer from disk. The
        text is re-read on that and on nothing else, so a fetch can never race
        a keystroke still in flight and put an older text back in the pane.
      */
      let drawnRevision = -1
      let takenReload = -1

      async function openDocument() {
        const path = await open({
          multiple: false,
          directory: false,
          filters: [{ name: 'Markdown', extensions: ['md'] }]
        })
        if (path === null) return // the user cancelled

        // The page on screen belongs to the document being replaced, so it
        // goes before the new one is asked for. Rust clears its own bytes for
        // the same reason.
        clear()

        try {
          await invoke('open_document', { path })
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        Take the document Finder handed the app, if one is waiting.

        A file association only launches the app; the path arrives in Rust as a
        run event, which can land before this script has run at all. So Rust
        parks it and this takes it — at startup, and again on every `opened`
        signal. The take empties the slot, so whichever of the two runs second
        gets nothing and does nothing, and the document opens once.

        It goes through `clear()` and `open_document` exactly as the dialog
        does. That is not tidiness: `clear()` is where this page resets the two
        counters it compares Rust's against, and Rust restarts both at 0 for
        every document, so an open that skipped it would leave both panes
        showing the old document under a new title.
      */
      async function takePendingOpen() {
        let path
        try {
          path = await invoke('pending_open')
        } catch (problem) {
          fail(problem)
          return
        }
        if (path === null) return // nothing was waiting

        clear()

        try {
          await invoke('open_document', { path })
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        Write the pane's text to the document's own path.

        The text goes over first, so the file is the pane and not the pane a
        moment ago: the keystroke that landed while the menu was opening is in
        Rust's buffer before the save reads it.
      */
      async function saveDocument() {
        try {
          await invoke('edit', { text: text.value })
          await invoke('save')
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        Save the page itself, where the user asks.

        Rust is asked for the default path first, and it refuses there when the
        pane is not current — so a pane with nothing to write never opens a
        dialog whose answer it would throw away. Nothing recompiles: the file
        is the bytes on screen.
      */
      async function exportDocument() {
        let defaultPath
        try {
          defaultPath = await invoke('export_path')
        } catch (problem) {
          fail(problem)
          return
        }

        const path = await save({
          defaultPath,
          filters: [{ name: 'PDF', extensions: ['pdf'] }]
        })
        if (path === null) return // the user cancelled

        try {
          await invoke('export', { path })
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        Every compile — the one an open asks for, and the ones the watch loop
        makes with nobody asking — ends in this. The signal carries no payload
        and the bytes come back through a command, because an event carrying
        them would serialize them as a JSON array of numbers, one per byte.

        The status comes back through a second command rather than with the
        bytes, because the bytes cross raw and a status does not. It arrives
        first, so the page knows whether there are new bytes to ask for at all.
      */
      async function refresh() {
        let state
        try {
          state = await invoke('status')
        } catch (problem) {
          fail(problem)
          return
        }

        report(state)

        /*
          Rust took a text from disk: an open, or an external change over a
          clean buffer. That is the only time this page's own text is replaced.

          The answer is captured before `takenReload` moves, because the pass
          that replaced the text is exactly the pass that must not follow the
          caret: assigning a textarea's `value` moves its caret to the end of
          the control, so following one here would open every document on its
          last page. An open is not a cursor movement.
        */
        const tookReload = state.reloaded !== takenReload
        if (tookReload) {
          takenReload = state.reloaded
          try {
            text.value = await invoke('document_text')
            relines()
          } catch (problem) {
            fail(problem)
          }
        }

        if (state.state !== 'current' || state.revision === drawnRevision) return

        try {
          const bytes = await invoke('current_pdf')
          /*
            **Only a render that drew may advance this.** `openPdf` returns
            false when it was superseded or could not measure the pane, and
            recording the revision anyway would tell the next signal that a
            page nobody ever drew is already on screen — after which
            `refresh` returns at the guard above forever, with no error and
            no way back.
          */
          if (await openPdf(bytes, tookReload ? null : caretPage(state.anchors))) {
            drawnRevision = state.revision
          }
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        The page the caret is in: the last heading at or above it, and `null`
        when there is none — a caret above the first heading, or a document with
        no headings at all. Both want page 1, which is where a frame with no
        fragment opens by itself, so neither is a case here.

        Counting newlines is not parsing markdown, and the distinction is the
        point rather than pedantry: this page owns no knowledge of the dialect
        and must not start owning any. It is also the one quantity both sides
        agree on, `selectionStart` being a UTF-16 offset where a line in Rust is
        counted from bytes.

        The precision is the document's heading density, and it follows the
        author rather than the reader: scroll the pane elsewhere and the next
        compile brings it back to the caret.
      */
      function caretPage(anchors) {
        const line = text.value.slice(0, text.selectionStart).split('\n').length

        let page = null
        for (const anchor of anchors) {
          if (anchor.line > line) break
          page = anchor.page
        }
        return page
      }

      /*
        Put the status where the window shows it: the line in the header, the
        error bar, and the mark a stale page wears. Every word here was chosen
        in Rust — the state's own name and the compile time — so this places
        text and never composes it.
      */
      function report(state) {
        status.className = state.state
        status.textContent = state.time
          ? `${state.state} · ${state.time}`
          : state.state

        error.textContent = state.error ?? ''
        error.hidden = state.error === null
        error.classList.toggle('alone', !state.page)

        divergence.textContent = state.divergence ?? ''
        divergence.hidden = state.divergence === null

        message.hidden = state.state !== 'empty'
        text.disabled = state.state === 'empty'
        pages.classList.toggle('stale', state.error !== null && state.page)

        parts(state)
      }

      /*
        Draw the file list. The master is marked as the one the pane holds —
        positionally, because today it always is.

        It is rebuilt on every status, which is every compile, and that is fine
        because the rows are inert. It would not be once they held a selection,
        which is one of the things "the rows do not load" above buys.

        **The list tracks the text exactly and retains nothing.** A master
        whose markers are deleted loses the rows on the next compile, because
        `section_paths` cannot fail and an empty list is therefore the answer
        rather than a failure to answer. The cost is a panel that flickers
        while a marker is half-typed; if that ever proves unbearable the answer
        is to damp this redraw, never to retain a list the text has stopped
        naming.
      */
      const files = document.getElementById('files')
      const list = document.getElementById('parts')
      const toggle = document.getElementById('toggle')

      /*
        Folded or not, held in the page. **Decided there rather than in
        `Preview`**, and it does not survive a restart.

        This app keeps its state in Rust where a test can reach it, and a flag
        kept in `localStorage` here would be the one piece of window state no
        test could hold. But that rule is about state that *decides
        behaviour*, and a fold decides nothing but its own drawing — nothing
        else reads it. Moving it to `Preview` would buy nothing either: both
        die with the process, this app persists nothing to disk, and a fold
        already survives an Open where it lives, `parts` reapplying
        `.collapsed` on every status.
      */
      let folded = false

      toggle.addEventListener('click', () => {
        folded = !folded
        toggle.setAttribute('aria-expanded', String(!folded))
        files.classList.toggle('collapsed', folded)
      })

      function parts(state) {
        files.hidden = state.sections.length === 0
        toggle.hidden = files.hidden
        if (files.hidden) {
          list.replaceChildren()
          return
        }

        files.classList.toggle('collapsed', folded)

        const row = (name, here) => {
          const li = document.createElement('li')
          li.textContent = name
          li.className = here ? 'here' : ''
          return li
        }

        list.replaceChildren(
          row(state.master ?? 'the document', true),
          ...state.sections.map((section) => row(section, false))
        )
      }

      /*
        **The pane draws the page itself.** One canvas per page in a container
        this app owns and scrolls, rasterised by `pdf.js` off the main thread.
        Nothing here hands the bytes to a viewer somebody else wrote, so the
        fit is an expression this file evaluates rather than a parameter a
        loader reads once.

        The bytes cross raw and **`getDocument` transfers the buffer to the
        worker**, so they cannot be read twice. The proxy is kept, because a
        re-render caused by geometry alone must not need new ones — and the
        one it replaces is destroyed, or its worker-side document leaks on
        every compile.

        Where the reader lands is by cause, and the causes are the ones
        `refresh` already distinguishes: a compile that took a text from disk
        opens at page 1, a compile after the author's own edit opens at the
        caret's page, and a compile landing while a width is still moving
        keeps the reader where the gesture left them — that one for that
        compile only, because the page must never move out from under a hand
        that is on it.
      */
      async function openPdf(bytes, page) {
        const seq = ++renderSeq
        cancelRenders()

        const next = pdfjs.getDocument({ data: new Uint8Array(bytes) })
        const opened = await next.promise
        if (seq !== renderSeq) {
          next.destroy()
          return false
        }
        loading?.destroy()
        loading = next
        doc = opened

        // Before the width is read: an element that is `display: none`
        // measures zero, and the scale is that measurement.
        pages.hidden = false
        if (!(await renderPages(seq))) return false

        if (anchor !== null) applyAnchor(anchor)
        else if (page === null) pages.scrollTop = 0
        else applyAnchor({ page: page - 1, fraction: 0 })
        return true
      }

      /*
        Draw every page of the retained document at the width the container
        has now, and answer whether the drawing finished.

        **The scale is recomputed here and held nowhere**, so a fit cannot go
        stale: it is `paneWidth / naturalWidth`, evaluated when the page is
        drawn. **The backing store is that viewport at the display's own pixel
        ratio** and the CSS size is left at the logical one — which is the
        thing a transform over a committed raster could never do, and the
        report that produced this renderer.

        **A canvas is swapped in only once it holds pixels.** Setting
        `canvas.width` clears it, so re-rendering in place would flash six
        empty pages at every rest. The outgoing canvas at its gesture size and
        the incoming one at its logical size occupy the same layout box, so
        nothing jumps as they are exchanged.
      */
      async function renderPages(seq) {
        rendering++
        try {
          return await drawPages(seq)
        } finally {
          rendering--
        }
      }

      async function drawPages(seq) {
        const ratio = window.devicePixelRatio
        const paneWidth = box().width
        if (!(paneWidth > 0)) return false // a pane with no width to fit to

        // Held rather than re-read: `clear` and a re-open both replace `doc`,
        // and this loop must find out by its own generation check rather than
        // by starting to draw a different document halfway down.
        const from = doc

        for (let n = 1; n <= from.numPages; n++) {
          let canvas
          let task
          try {
            const page = await from.getPage(n)
            if (seq !== renderSeq) return false

            const scale = paneWidth / page.getViewport({ scale: 1 }).width
            const viewport = page.getViewport({ scale })

            /*
              The logical size is taken to whole CSS pixels and the backing
              store is derived from it, so that the backing store is exactly
              `floor(cssWidth × devicePixelRatio)`. The two are one number in
              exact arithmetic — `naturalWidth × (paneWidth / naturalWidth)`
              is the pane width — but in floating point it lands an ulp under,
              and flooring that costs a device pixel the CSS size still
              claims. Rounding here also makes the fit exact rather than an
              ulp short of the pane.
            */
            const cssWidth = Math.round(viewport.width)
            const cssHeight = Math.round(viewport.height)

            canvas = document.createElement('canvas')
            canvas.width = Math.floor(cssWidth * ratio)
            canvas.height = Math.floor(cssHeight * ratio)
            // What the CSS size is written from, here and through a gesture.
            canvas.logical = { w: cssWidth, h: cssHeight }
            size(canvas, 1)

            task = page.render({
              canvas,
              viewport,
              transform: [ratio, 0, 0, ratio, 0, 0]
            })
            inflight.add(task)
            await task.promise
          } catch (problem) {
            /*
              Superseded — by another render, by a re-open, or by `clear`
              destroying this document out from under the loop. None of those
              is news, and the generation check is what tells them from a real
              failure, which is re-thrown for `refresh` to put on the page.
            */
            if (seq !== renderSeq) return false
            if (problem instanceof pdfjs.RenderingCancelledException) {
              return false
            }
            throw problem
          } finally {
            if (task) inflight.delete(task)
          }
          if (seq !== renderSeq) return false

          const old = pages.children[n - 1]
          if (old) pages.replaceChild(canvas, old)
          else pages.append(canvas)
        }

        // A document that lost pages leaves canvases behind it.
        while (pages.children.length > from.numPages) {
          pages.lastElementChild.remove()
        }

        // Every canvas above was inserted at its logical size already; this is
        // the function that owns the rule, and it is what closes a gesture.
        unscale()
        fitted = paneWidth
        return true
      }

      // What the next render cancels. A task cancelled here rejects inside
      // `renderPages`, which returns rather than touching the page.
      function cancelRenders() {
        for (const task of inflight) task.cancel()
        inflight.clear()
      }

      /*
        A refusal that is not a compile status: an open that would not read, or
        an export the pane cannot serve. It reaches the page in Rust's own
        words, in the bar the compile error uses, and the next compile's status
        replaces it.

        The last good page survives it, here as everywhere. An author mid-edit
        passes through broken states constantly — a half-typed table, a fence
        not yet closed — and blanking the pane on each one would lose their
        place.
      */
      function fail(problem) {
        error.textContent = String(problem)
        error.hidden = false

        const drawing = !pages.hidden
        error.classList.toggle('alone', !drawing)
        message.hidden = true
        if (drawing) pages.classList.add('stale')
      }

      // Back to the empty state, holding no document's page and no text.
      function clear() {
        message.hidden = false
        divergence.hidden = true
        error.hidden = true
        status.textContent = ''
        status.className = ''
        text.value = ''
        text.disabled = true
        relines()
        renderSeq++
        cancelRenders()
        pages.hidden = true
        pages.classList.remove('stale')
        pages.replaceChildren()
        loading?.destroy()
        loading = null
        doc = null
        fitted = null
        anchor = null
        drawnRevision = -1
        takenReload = -1
      }

      /*
        **A gesture is carried by CSS size; a rest is answered by a render.**

        A width that is moving cannot be answered by re-rendering. The
        divider's drag sets a flex basis on every `pointermove`, six pages cost
        some 94 ms against a frame's 16.7 ms, and every render would be
        cancelled by the next — so nothing would complete until the hand came
        off, and a cancelled render on a just-resized canvas leaves it cleared.
        The literal reading blanks the pane through the drag.

        So while a width is changing the canvases are resized by CSS and the
        browser resamples bitmaps it already has; when the width rests they are
        re-rendered at the new scale, which is sharp because the raster is made
        for that width. The cost of a step is a relayout and a repaint, far
        under what a render costs, which is what the gesture exists to avoid.

        **The rest costs nothing it used to.** A redraw through WebKit could
        not restore the reader's place, because that view leaks none; a
        renderer this project owns re-rasterises into canvases it already
        positions, so a rest is the same page at the same place in it, sharper.
      */

      // The pane width the raster now in the canvases was made for. Null when
      // nothing is drawn, which is the only time there is nothing to hold.
      let fitted = null

      /*
        Where the reader is, taken when a gesture starts and held until the
        render that ends it: a page index and a fraction within that page.

        **Not a pixel offset.** The scale changes with the width, so every
        canvas's height and the container's `scrollHeight` change with it — an
        offset held across that moves the reader, and clamps at the bottom when
        a pane widens and then narrows. An index and a fraction survive both a
        scale change and a document that gained a page.

        **Non-null is what "a gesture is open" means**, which is why nothing
        here keys on `pointerdown`: a window drag-resize has no pointer event
        to mark a start, and a control taking width out of the column has none
        either. A width arriving while it differs from `fitted` opens a
        gesture; one arriving while a gesture is open continues it.
      */
      let anchor = null

      // What the pages have to fill. The container's own box, not the column's
      // — it is a flex child, so the bars above it are already out of its
      // height, and its content box is already less whatever scrollbar track
      // the machine reserves.
      function box() {
        return { width: pages.clientWidth, height: pages.clientHeight }
      }

      /*
        A canvas's CSS size is its logical size times the gesture's scale.

        **Which property carries a gesture is a decision and not a style.** A
        transform leaves layout alone, so the container's `scrollHeight` would
        hold its pre-gesture extent and the anchor above would be read against
        a stale one. CSS width makes the extent track the gesture — and makes
        the backing store and the CSS size diverge during one and agree again
        at rest, so a rest that never came is visible.
      */
      function size(canvas, scale) {
        canvas.style.width = `${canvas.logical.w * scale}px`
        canvas.style.height = `${canvas.logical.h * scale}px`
      }

      /*
        **The factor is read per canvas, not once for the list.** They are
        normally all made for the same width, so this is `width / fitted` for
        every one of them — but a compile landing mid-gesture swaps its pages
        in one at a time, and for those few frames the list holds rasters from
        two different widths. Each canvas carries the width its own raster was
        made for, so each one lands at the container's width regardless.
      */
      function fit() {
        const width = box().width
        if (!(width > 0)) return
        for (const canvas of pages.children) {
          size(canvas, width / canvas.logical.w)
        }
      }

      /*
        Back to the size the raster was made for. It **writes** the logical
        size rather than clearing it: a canvas with no CSS size lays out at its
        backing store, which at a pixel ratio of 2 is a page twice the pane's
        width.
      */
      function unscale() {
        for (const canvas of pages.children) size(canvas, 1)
      }

      // Which page the container is scrolled into, and how far through it.
      function readAnchor() {
        const kids = pages.children
        if (kids.length === 0) return null

        const top = pages.scrollTop
        let i = kids.length - 1
        for (let k = 0; k < kids.length; k++) {
          if (kids[k].offsetTop + kids[k].offsetHeight > top) {
            i = k
            break
          }
        }
        const height = kids[i].offsetHeight || 1
        return { page: i, fraction: (top - kids[i].offsetTop) / height }
      }

      function applyAnchor(at) {
        const kids = pages.children
        if (at === null || kids.length === 0) return
        const i = Math.min(at.page, kids.length - 1)
        pages.scrollTop = kids[i].offsetTop + at.fraction * kids[i].offsetHeight
      }

      /*
        Draw the pages again at the width they ended up with, and put the
        reader back where the gesture started.

        It draws from the retained document and invokes nothing. Skipped when
        the width did not move — a window resized by its height alone changes
        no scale — and that is also where a gesture that never changed anything
        is closed.

        Cosmetic, so it swallows what it fails at: the canvases keep the size
        the gesture left them at, soft rather than absent, and the next compile
        re-renders them anyway.
      */
      async function rerender() {
        if (pages.hidden || doc === null) return
        if (box().width === fitted) {
          anchor = null
          return
        }

        /*
          **A rest never cancels a render that is still running.** On an open
          the pane is unhidden, which is a resize, which arms this timer — so
          it can come due while the first render is still drawing. Cancelling
          there would leave the pane empty and `fitted` unset, and the render
          that was going to fix it is the one just cancelled. The width is
          still wrong, so the timer is re-armed and this returns to it.
        */
        if (rendering > 0) {
          settle()
          return
        }

        const seq = ++renderSeq
        cancelRenders()
        try {
          if (!(await renderPages(seq))) return
        } catch {
          return // left scaled, deliberately. See above.
        }
        applyAnchor(anchor)
        anchor = null
      }

      /*
        A drag ends on an event and a window resize does not, so the timer is
        what gives the second one an end. It is not the compile's debounce —
        nothing about the document turns on it, and it only decides when a
        picture is drawn again.
      */
      let settling = null
      const settle = () => {
        clearTimeout(settling)
        settling = setTimeout(() => {
          rerender()
          relines()
        }, 200)
      }

      /*
        **What the page watches is the pane, not the events that resize it.**

        A window resize is one cause among several and it was the only one
        wired: folding the section panel, and showing the line gutter, both
        take their width out of this column. Listing the causes is how that bug
        happened twice, and the next control added to the row would have
        reintroduced it. The rule outlived the renderer it was found in.

        **The anchor is read before `fit` reflows.** The canvases still hold
        their pre-gesture CSS size at this point, so this is where the reader
        actually was. Resizing by CSS reflows, so a gesture of factor `s` maps
        a content offset `T` to `T·s` while the browser holds `scrollTop` at
        `T` — the reader is displaced continuously through the drag unless the
        anchor is put back on every step, and WebKit implements no scroll
        anchoring that would compensate.
      */
      new ResizeObserver(() => {
        if (!pages.hidden && fitted !== null && box().width !== fitted) {
          if (anchor === null) anchor = readAnchor()
          fit()
          applyAnchor(anchor)
        }
        settle()
      }).observe(pages)

      /*
        Number the lines the buffer has.

        **A row is as tall as its line renders.** A textarea soft-wraps, so one
        logical line can occupy three rows on screen, and a gutter that gave
        every number one line-height would drift further out of true with every
        wrap until the numbers meant nothing. There is no way to ask a textarea
        where its wraps fell, so the heights are measured off a mirror: the same
        text, the same font, laid out at the same content width, one element per
        logical line. What the browser does to the mirror is what it did to the
        textarea.

        **An empty logical line is mirrored as a zero-width space**, and markdown
        is mostly blank lines. The failure without it **accumulates** rather than
        costing one row its height: `rows` is a running sum over the measured
        heights, so every blank line above a row shifts that row by one line
        more than the blank line before it did.

        Rebuilt when the text changes or the width does, and skipped when
        neither has. **The width-change rebuild rides `settle`'s 200 ms timer**,
        not a `pointermove` and not the `pointerup` itself: the measurement is a
        layout, and a layout per frame for a column of numbers nobody is reading
        mid-drag is waste.
      */
      const lines = document.getElementById('lines')
      const mirror = document.getElementById('mirror')
      const numbers = document.getElementById('numbers')

      // What the gutter was last built for, so an event that changed neither
      // costs nothing.
      let linedText = null
      let linedWidth = null

      // Where each row starts, plus the heights beside it. Null until measured.
      let rows = null

      // Which gutter row currently wears the mark, so clearing it is one
      // element rather than a walk.
      let marked = -1

      function relines() {
        if (lines.hidden) return

        const style = getComputedStyle(text)
        const width =
          text.clientWidth -
          parseFloat(style.paddingLeft) -
          parseFloat(style.paddingRight)

        if (text.value === linedText && width === linedWidth) return
        linedText = text.value
        linedWidth = width

        if (text.value === '') {
          lines.replaceChildren()
          rows = null
          marked = -1
          // And the band with them. `clear()` reaches here, and this is the
          // only path to it: the two other callers of `markLine` need a
          // focused, enabled textarea, which a cleared pane is not. Without
          // this the previous document's band stays painted across an empty
          // one until something opens.
          markLine()
          return
        }

        mirror.style.width = `${width}px`
        mirror.replaceChildren(
          ...text.value.split('\n').map((line) => {
            const row = document.createElement('div')
            // An empty line still occupies one, and an empty element does not.
            row.textContent = line === '' ? '\u200b' : line
            return row
          })
        )

        // One read of the whole mirror, then one write of the whole gutter.
        const heights = Array.from(mirror.children, (row) => row.offsetHeight)
        lines.replaceChildren(
          ...heights.map((height, i) => {
            const row = document.createElement('div')
            row.style.height = `${height}px`
            row.textContent = String(i + 1)
            return row
          })
        )

        // Kept for the band, which needs where each row starts and how tall it
        // is — the same measurement, so it is taken once and read twice.
        rows = heights.reduce(
          (at, height) => (at.push(at[at.length - 1] + height), at),
          [0]
        )
        rows.heights = heights
        marked = -1 // the rows above are new elements; none of them wears it

        lines.scrollTop = text.scrollTop
        markLine()
      }

      /*
        The line the caret is in, marked twice: its number in the gutter, and a
        band behind the line itself.

        The line is counted the way `caretPage` counts it, off `selectionStart`,
        because a second way of finding the caret's line would be a second thing
        that can disagree with the page the pane opens on — and the disagreement
        would be invisible until it was not.

        Only in Lines mode. The band is placed from the measured rows, and the
        rows are only measured when the gutter is drawing them — so the mode
        that pays for the measurement is the mode that gets the band.
      */
      function markLine() {
        if (lines.hidden || rows === null || text.value === '') {
          text.style.backgroundImage = ''
          return
        }

        const line = text.value.slice(0, text.selectionStart).split('\n').length
        const i = Math.min(line - 1, rows.heights.length - 1)

        // Only the two rows that change. Walking the gutter to clear it would
        // be a pass over every line in the document on every arrow key.
        if (marked !== i) {
          lines.children[marked]?.classList.remove('here')
          lines.children[i]?.classList.add('here')
          marked = i
        }

        // Placed from the padding box, which is where a background starts, so
        // the pane's own top padding is added to the row's offset.
        const top = parseFloat(getComputedStyle(text).paddingTop) + rows[i]
        text.style.backgroundImage =
          'linear-gradient(var(--band), var(--band))'
        text.style.backgroundSize = `100% ${rows.heights[i]}px`
        text.style.backgroundPosition = `0 ${top}px`
      }

      /*
        **The gutter does not scroll; it follows.** Its box does not scroll
        itself and its `scrollTop` is driven from the textarea's — here, and
        again whenever the rows are rebuilt. Without this the numbers part
        company with their lines the moment a document is taller than the pane,
        which is every document.

        **The band needs none of it**: `background-attachment: local` scrolls it
        with the text. That is the contrast the two are built around.
      */
      text.addEventListener('scroll', () => {
        lines.scrollTop = text.scrollTop
      })

      // A caret moves without the text changing — an arrow key, a click, a
      // drag — and `relines` returns early on exactly those, so the mark needs
      // its own event rather than a ride on that one.
      document.addEventListener('selectionchange', () => {
        if (document.activeElement === text) markLine()
      })
      text.addEventListener('keyup', markLine)
      text.addEventListener('click', markLine)

      numbers.addEventListener('click', () => {
        const on = numbers.getAttribute('aria-pressed') !== 'true'
        numbers.setAttribute('aria-pressed', String(on))
        lines.hidden = !on
        relines()
        markLine()
      })

      /*
        Drag the divider. Nothing is done to the pane for the length of the
        drag any more: the `pointer-events` this used to hang on the frame
        existed to stop WebKit's PDF view swallowing the pointer, and the frame
        is gone.
      */
      const divider = document.getElementById('divider')
      divider.addEventListener('pointerdown', (down) => {
        divider.setPointerCapture(down.pointerId)

        /*
          Where the text pane starts, taken once at the grab. `clientX` is
          measured from the window and the width being set is the pane's own,
          so the two differ by whatever sits to the left — which was nothing
          until the section panel did. Setting one from the other unconverted
          moved the divider to the panel's width the moment it was touched.

          Once per drag rather than once per move: the panel cannot be folded
          while the pointer is held here, so this does not change under the
          drag, and reading layout in a pointermove costs a reflow each time.
        */
        const from = text.getBoundingClientRect().left
        const room = document.body.clientWidth - from

        const move = (at) => {
          const width = Math.min(Math.max(at.clientX - from, 120), room - 160)
          text.style.flexBasis = `${width}px`
          fit()
        }
        const up = () => {
          divider.removeEventListener('pointermove', move)
          divider.removeEventListener('pointerup', up)
          settle()
        }

        divider.addEventListener('pointermove', move)
        divider.addEventListener('pointerup', up)
      })

      // Every change goes to Rust, which holds the buffer and owns the
      // debounce. A debounce in this page would be logic reachable only by
      // typing at the window, and no test could hold it.
      text.addEventListener('input', () => {
        invoke('edit', { text: text.value })
        relines()
      })

      document.getElementById('open').addEventListener('click', openDocument)
      document.getElementById('save').addEventListener('click', saveDocument)
      document.getElementById('export').addEventListener('click', exportDocument)
      listen('open', openDocument)
      listen('save', saveDocument)
      listen('export', exportDocument)
      listen('rendered', refresh)
      listen('opened', takePendingOpen)

      /*
        These two run last, and the ordering above them is load-bearing though
        it does not look it: the listens are registered first, so the take below
        sits after the listener rather than before it.

        The limit that accepts, recorded rather than fixed: `listen` completes
        over IPC, so a document landing between this take and the listener's
        actual registration would sit in Rust's slot until the next signal. The
        source ordering makes that window practically unreachable, and the cost
        if it is ever reached is a document that opens late rather than one that
        opens wrong.
      */


      // The launch state is a state like the others, and Rust names it too.
      refresh()

      // And a document Finder handed over before this script existed.
      takePendingOpen()
    </script>
  </body>
</html>
