<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>md2pdf</title>
    <style>
      /*
        The whole front end is this one file, plus the two `pdf.js` modules
        vendored beside it. `withGlobalTauri` puts the API on
        `window.__TAURI__` and `pdfjs-dist` ships browser-ready ES modules, so
        there is still no bundler and no npm toolchain here: `frontendDist` is
        a directory of static files, and the app is one Cargo build.
      */
      :root {
        color-scheme: light dark;
        --ground: #f4f4f2;
        --chrome: #e8e8e4;
        --edge: #d5d5cf;
        --ink: #2b3140;
        --quiet: #6b7280;
        --alarm: #a03323;
        --band: #e9e9e4;
        /*
          The colour of paper, and **it is deliberately not overridden in
          dark.** It stands in for a page whose raster has not been made yet or
          has been released, and that raster is white in either palette because
          the document is. A dark `--paper` would put a dark rectangle exactly
          where the reader is about to see a white one.
        */
        --paper: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #1c1f27;
          --chrome: #262a34;
          --edge: #363b47;
          --ink: #e6e6e2;
          --quiet: #9aa1ae;
          --alarm: #e08573;
          --band: #242833;
        }
      }

      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--ground);
        color: var(--ink);
        font:
          13px/1.5 -apple-system,
          system-ui,
          sans-serif;
      }

      header {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 8px 12px;
        background: var(--chrome);
        border-bottom: 1px solid var(--edge);
      }
      button {
        font: inherit;
        color: inherit;
        padding: 4px 14px;
        border: 1px solid var(--edge);
        border-radius: 6px;
        background: var(--ground);
      }
      button:active {
        background: var(--edge);
      }
      /*
        The fit control. A `select` and not a row of buttons because the ten
        choices are one exclusive setting, and because **the list is the
        cap**: nothing above 400% is offered and no second clamp is written
        anywhere in this file. The control is the whole surface — there is no
        pinch and no wheel — so a scale stated twice would be a scale stated
        once wrongly.
      */
      select {
        font: inherit;
        color: inherit;
        padding: 3px 6px;
        border: 1px solid var(--edge);
        border-radius: 6px;
        background: var(--ground);
      }

      /*
        The status line. Every word in it is chosen in Rust and this only
        places it, so the four states are checked by tests rather than by eye.
        The class is the state's own name, so the colour follows the word.
      */
      #status {
        margin-left: auto;
        color: var(--quiet);
        font-variant-numeric: tabular-nums;
      }
      #status.stale,
      #status.failed {
        color: var(--alarm);
      }

      main {
        flex: 1;
        display: flex;
        min-height: 0;
        /* The containing block `#viewer` is positioned against. Nothing else
           moves for it: `#pages` already carries its own `position`, and
           `#mirror` is pinned at `top: -99999px; left: 0`, so no reader of an
           `offsetTop` in this file changes its answer. */
        position: relative;
      }

      /*
        A picture over the text pane. `mpdf-010` Phase 5.

        **It covers the textarea rather than replacing it**, and that is why it
        is absolutely positioned rather than a third flex child: `#divider`'s
        drag reads `#text`'s own box at every `pointerdown`, and a hidden
        textarea measures zero. Left and width are mirrored off `#text` by
        `placeViewer`, which a `ResizeObserver` over the three boxes that decide
        that column drives — `#files` and `#lines`, which are all that sit to
        its left, and `#text`, whose own width the divider and the window set.

        **The pane goes on holding the file it held.** Nothing here touches
        `edited`, the buffer, the compile, the bytes or the anchors — `⌘S` still
        writes the markdown and the page still shows the whole document. It is a
        view, the way `Lines` is a view, and `Status` gains no field for it.
      */
      #viewer {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 3;
        /* A `<figure>` carries `margin: 1em 40px` from the user agent, which
           would put this 40 px off the column it is meant to cover. */
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--ground);
      }
      #viewer[hidden] {
        display: none;
      }
      #viewer .bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: var(--chrome);
        border-bottom: 1px solid var(--edge);
        color: var(--quiet);
        font:
          11px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #viewer .bar .path {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /*
        **The figure sits in the upper third**, neither centred nor against the
        top. Centred, a small figure lands at the pane's waist and reads as
        nothing in particular; flush to the top it reads as a header.

        **The padding above it is free, and `box-sizing` is not what makes it
        so** — two drafts of this phase said it was and both were wrong.
        Flexbox distributes free space over its items' *outer* sizes, so a
        `flex: 1` sheet's padding is already accounted for: measured in
        Chromium over a 400 px column with a 100 px top padding, the sheet is
        400 px and overflows by 0 under **both** values of `box-sizing`. The
        overflow-by-exactly-the-padding behaviour is real and belongs to
        `height: 100%`, which is not what this is. So the image's
        `max-height: 100%` resolves against a content box that already excludes
        the padding, and measures the right number.
      */
      #viewer .sheet {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 56px 12px 12px;
        overflow: auto;
      }
      #viewer img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        /* A transparent PNG over the pane's own ground reads as a hole. */
        background: var(--paper);
      }
      #viewer .said {
        margin: 0;
        color: var(--quiet);
      }

      /*
        The file panel. It lists the project: every file under the root that
        this dialect can read — markdown, bibliographies and every extension it
        accepts as a figure — with folders derived here from the path segments
        and the file that compiles marked. **Every open document draws one**,
        including a lone `.md` that names nothing, which is what lets an author
        build a first section without leaving the window.

        Rust sends a flat list of `{ path, kind, missing }` and no directories.
        The headings and the indent below are read off `path`, which is a thing
        a page can do and a thing a nested node type would make `Status` carry
        twice. The order is Rust's too — files before folders, each byte-wise
        alphabetical — so the panel cannot reorder itself between two compiles
        of the same tree.

        **A left column, before the text pane, and the placement is
        load-bearing rather than taste.** It is the panel `mpdf-003` Phase 7
        records two geometry bugs against: the divider read `clientX`, measured
        from the window, which matched the pane's own width until this sat to
        the left of it. `#divider` takes its grab point from the text pane's
        own left edge because of this element.

        **The rows open, and two gestures on a row are two gestures.** The body
        of a markdown row puts that file in the pane; the `main` button that
        appears beside it sets which file compiles. They were kept apart before
        there were two of them rather than after, which is why the second one is
        a button of its own and not a modifier on the first.

        **A row can carry two marks, because they are two facts.** `.here` is
        the file that compiles and `.holding` is the file the pane is showing;
        they sit on one row at every open and on two rows from the first click.
        Rust sends both in the status, so the panel is still rebuilt whole on
        every one and **the rows still hold no state of their own.**

        `mpdf-010` Phase 2, over Phase 1's panel.
      */
      #files {
        flex: 0 0 auto;
        min-width: 0;
        max-width: 40%;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 10px 0;
        background: var(--chrome);
        border-right: 1px solid var(--edge);
      }
      #files[hidden] {
        display: none;
      }
      /*
        Collapsed is not hidden, and the two are different states. No document
        open at all has no panel and no toggle — `hidden`. A reader who folded
        the panel away keeps the toggle, so they can get it back — `.collapsed`.
      */
      #files.collapsed {
        display: none;
      }

      /*
        The toggle. Leftmost in the header because it works the leftmost pane,
        and text rather than an icon because every other control here is text.
        The chevron turns; it does not redraw.
      */
      #toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      #toggle[hidden] {
        display: none;
      }
      #toggle::before {
        content: '';
        width: 0;
        height: 0;
        border: 4px solid transparent;
        border-left-color: currentColor;
        border-right: 0;
        transform-origin: 25% 50%;
        transition: transform 120ms ease;
      }
      #toggle[aria-expanded='true']::before {
        transform: rotate(90deg);
      }
      /*
        The heading is a row so the one control the panel itself carries can sit
        at its end, where `.mark` and `.set` sit on a file's row — `margin-left:
        auto` in all three places, because the panel has one right edge and
        everything that hangs off it should hang off it the same way.
      */
      #files h2 {
        display: flex;
        align-items: center;
        margin: 0 0 6px;
        padding: 0 12px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--quiet);
      }
      /*
        The `+` that reveals the name field. It is drawn like `.set` and not
        like a header button: it belongs to the panel, and the panel's controls
        are small, quiet and square.

        **It is always there, where `.set` appears on hover.** A row has nine
        siblings and would be nine buttons at once; this is one, and a reader
        looking for how to add a file has nowhere else to look.
      */
      #files h2 .new {
        margin-left: auto;
        padding: 0 6px;
        border: 1px solid var(--edge);
        border-radius: 3px;
        background: var(--ground);
        color: var(--quiet);
        font: inherit;
        font-size: 11px;
        line-height: 1.4;
        cursor: pointer;
      }
      #files h2 .new:hover,
      #files h2 .new[aria-expanded='true'] {
        color: var(--ink);
        border-color: var(--ink);
      }
      /*
        The name field, and the sentence a refused create leaves beside it.

        **Both sit in `#files` and outside `<ol id="parts">`**, which is a
        correctness constraint and not a layout preference: `parts()` replaces
        that list whole on every status, and a field inside it would lose what
        the author had typed to a filesystem event they did not cause. It is the
        same fact as *the rows hold no selection*, read from the other side.

        The refusal is Rust's sentence and this only places it, as every status
        sentence is placed. **It does not go through `fail`** — that marks the
        compiled page stale, and a create compiles nothing — **nor through the
        divergence bar**, whose `Discard` is meaningless here. It is the same
        exception `saySoInstead` takes, and it is the first refusal in this
        panel a reader meets by typing.
      */
      #files #new-file {
        display: flex;
        gap: 6px;
        margin: 0 0 6px;
        padding: 0 12px;
      }
      #files #new-file[hidden] {
        display: none;
      }
      #files #new-name {
        flex: 1;
        min-width: 0;
        padding: 2px 6px;
        border: 1px solid var(--edge);
        border-radius: 3px;
        background: var(--ground);
        color: var(--ink);
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #files #new-file button {
        flex: none;
        padding: 2px 8px;
        border-radius: 3px;
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #files #new-refusal {
        margin: 0 0 6px;
        padding: 0 12px;
        color: var(--alarm);
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #files #new-refusal[hidden] {
        display: none;
      }
      #files ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #files li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        white-space: nowrap;
        color: var(--quiet);
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      /*
        The indent is a padding on the row and not a margin on its text, so the
        marks below still start at the panel's own edge whatever the depth. One
        step per segment above the root, set from the page.
      */
      #files li[data-depth='1'] { padding-left: 26px; }
      #files li[data-depth='2'] { padding-left: 40px; }
      #files li[data-depth='3'] { padding-left: 54px; }
      #files li[data-depth='4'] { padding-left: 68px; }
      /*
        Deeper than four and the indent stops growing rather than eating the
        panel. The path is still the row's title, so nothing is unreadable.
      */
      #files li[data-depth='5'] { padding-left: 82px; }

      /*
        A folder heading. It is a row like the others so the indent rule reaches
        it, and it names one segment rather than the whole path — the rows under
        it carry the rest.
      */
      #files li.folder {
        color: var(--quiet);
        opacity: 0.75;
      }
      #files li.folder .name::after {
        content: '/';
      }
      /* The one that compiles. */
      #files li.here {
        color: var(--ink);
        box-shadow: inset 2px 0 0 var(--ink);
      }
      /*
        The one the pane is holding, which is a different fact and gets a
        different mark: a band rather than an edge, so a row that is both — every
        row at every open — reads as both rather than as one drawn twice.

        **The band is the text pane's own ground and not `--band`**, which is
        the gutter's caret colour and is a point away from `--chrome` here: over
        the panel it would be invisible in both themes. This row is what the pane
        is showing, so it wears the pane's own colour, which is lighter than the
        panel in the light theme and darker in the dark one.
      */
      #files li.holding {
        color: var(--ink);
        background: var(--ground);
      }
      /*
        A file the master names that the disk does not hold. It is the row the
        author most needs, so it is marked rather than dimmed: the compile is
        refusing on exactly this path.
      */
      #files li.missing .name {
        color: var(--alarm);
        text-decoration: line-through;
      }
      #files li .name {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /*
        A row that opens draws its name as a button rather than a span, so the
        gesture is reachable from the keyboard and announces itself as one. It
        is styled back to the row it sits in: the affordance is the row, not a
        control drawn inside it.
      */
      #files li button.name {
        flex: 1;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      #files li button.name:hover {
        color: var(--ink);
      }
      #files li .mark {
        margin-left: auto;
        font-size: 10px;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      /*
        The row's own gestures, and there are two of them now: `main` sets which
        file compiles, `trash` moves the file to the Trash. Each appears on
        hover and on focus, so they are reachable from the keyboard without
        being eighteen buttons on screen at once.

        **`margin-left: auto` moved from the button to the group, and that is a
        correction rather than a tidy.** OQ-5 put it on `.set` "because only one
        of the two is ever on a row" — meaning the button and the `◀ main` mark
        — and a non-main markdown row now draws two buttons. Two elements each
        claiming the free space would push the first off that edge, so they
        share it inside `.controls` and the mark keeps it alone on the row that
        has no buttons at all.
      */
      #files li .controls {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }
      #files li .controls button {
        padding: 0 6px;
        border: 1px solid var(--edge);
        border-radius: 3px;
        background: var(--ground);
        color: var(--quiet);
        font: inherit;
        font-size: 10px;
        cursor: pointer;
        visibility: hidden;
      }
      #files li:hover .controls button,
      #files li .controls button:focus-visible {
        visibility: visible;
      }
      #files li .controls button:hover {
        color: var(--ink);
        border-color: var(--ink);
      }
      /*
        The one destructive gesture in this app wears the one alarming colour,
        and only under the pointer: quiet like its neighbour until it is about
        to be pressed, so a row does not read as a warning at rest.
      */
      #files li .controls .trash:hover {
        color: var(--alarm);
        border-color: var(--alarm);
      }

      /*
        The line gutter. A view and nothing else: it numbers the lines the
        buffer already has and changes not one byte of it.

        **What it is *not* is a second editor**, and that is the decision the
        rest depends on. The textarea stays the editor, so the buffer sent to
        `edit`, the reload that replaces `value`, `caretPage`'s
        `selectionStart`, the disabled state and the divider's geometry all keep
        the single implementation they have — none of which any test in this
        repository reaches. A code editor component would fork every one of
        them and would need a bundler besides, which is the thing
        `withGlobalTauri` exists to avoid.

        **A row is as tall as its line renders, not one line-height**, because a
        soft-wrapped paragraph occupies several rows on screen and a gutter that
        assumed otherwise would drift a number further out of true with every
        wrap. The heights come off a hidden mirror of the text laid out at the
        pane's own width; `relines` argues it.

        **`overflow: hidden` here is half of a pair rather than tidiness.** This
        box does not scroll itself; its `scrollTop` is driven from the
        textarea's, by `relines` and by the `scroll` listener below. The band
        takes the other route entirely — `background-attachment: local` — and
        that contrast is why the two are built differently.

        `mpdf-003` Phase 8.
      */
      #lines {
        flex: none;
        overflow: hidden;
        box-sizing: border-box;
        padding: 12px 8px 12px 12px;
        text-align: right;
        background: var(--chrome);
        border-right: 1px solid var(--edge);
        color: var(--quiet);
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        user-select: none;
        cursor: default;
      }
      #lines[hidden] {
        display: none;
      }
      #lines div {
        /* Set per row from the measured height; this is the unwrapped case. */
        line-height: 1.6;
      }
      /* The row the caret is in. */
      #lines div.here {
        color: var(--ink);
        background: var(--band);
      }

      /* The mirror. Never seen; only measured. */
      #mirror {
        position: absolute;
        top: -99999px;
        left: 0;
        visibility: hidden;
        box-sizing: border-box;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        tab-size: 4;
      }

      /* A view toggle that is on. The panel's chevron turns; this one fills. */
      #numbers[aria-pressed='true'] {
        background: var(--edge);
      }

      /*
        The text pane. A plain textarea and nothing more: no highlighting, no
        autocomplete, no formatting commands. Its text is what compiles — the
        file beside it need never have held that text — and every change is
        sent to Rust, which holds the buffer and owns the debounce.
      */
      #text {
        flex: 0 0 40%;
        min-width: 12ch;
        box-sizing: border-box;
        margin: 0;
        padding: 12px 14px;
        border: 0;
        resize: none;
        background: var(--ground);
        color: var(--ink);
        /*
          The band under the caret's line is painted as this element's own
          background — a gradient of one colour, sized and placed from the
          measured row. **`local` is what makes it scroll with the text**: the
          default would pin it to the border box and it would sit still while
          the lines moved under it.

          **`no-repeat` cost a build.** The gradient is sized to the one
          measured row and a background repeats by default, so without it the
          band tiles down the whole pane and every line wears one.

          A band drawn as an element would need the textarea wrapped, made
          transparent, and layered over — and the divider's geometry, which
          reads this element's own box, would move with it. The background
          costs none of that.
        */
        background-attachment: local;
        background-repeat: no-repeat;
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        tab-size: 4;
      }
      #text:disabled {
        color: var(--quiet);
      }

      /* The divider the reader drags. It is the only chrome between panes. */
      #divider {
        flex: none;
        width: 5px;
        cursor: col-resize;
        background: var(--edge);
      }

      #preview {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        /* The pages scroll in their own container, never in this column. */
        overflow: hidden;
      }

      /*
        The scroll container the pages sit in, and the element every width in
        this file is measured from. **The fit is its `clientWidth`**, not the
        column's: on a machine set to show classic scrollbars its content box
        is some 15 px narrower, which is the difference between a page that
        fits and a page clipped at its right edge.

        `overflow-y: scroll` rather than `auto`, so that width cannot move
        under the fit. With `auto` a document sitting just under the scroll
        threshold gains a scrollbar the moment the pages widen, the content
        box narrows by the track, and the pages clip.

        **`overflow-x` is opened by the fit that can cross it, and by no
        other.** An explicit scale draws a page wider than the pane — 2,381 px
        against 520 at 400% — and under `hidden` everything past the right edge
        is unreachable rather than merely off screen. So `.wide` puts `auto` on
        this box while the fit is a pinned scale. Fit-to-width draws a page
        exactly `clientWidth` wide and fit-page one at most that wide, so
        neither can ever overflow sideways and neither needs the axis.

        **Opening it unconditionally is what the first build did, and the
        window said no**: 21 `ResizeObserver loop completed with undelivered
        notifications` in one gate run, against none before, all of them in a
        drag being scrolled under. The loop is this box's own: the observer's
        callback writes page widths, a drag moving faster than the callback
        leaves them momentarily wider than the box, `auto` answers with a
        horizontal track, the track takes ~15 px out of `clientHeight` — and a
        changed content box is a fresh notification for the very observer that
        caused it. `hidden` absorbed that transient silently for as long as no
        page could legitimately be wider. **Under a pinned scale the loop
        cannot form**, because `fit()` declines to act there and the callback
        writes no width at all.

        Fit-page is also the fit that reads `clientHeight`, and it never has
        the track, so the boundary it derives is never measured against a
        height a scrollbar has taken.

        `position: relative` makes each page's `offsetTop` a measurement from
        this box, which is what the reader's place is read against.
      */
      #pages {
        flex: 1;
        min-width: 0;
        min-height: 0;
        position: relative;
        overflow-y: scroll;
        overflow-x: hidden;
      }
      #pages.wide {
        overflow-x: auto;
      }
      #pages[hidden] {
        display: none;
      }
      /*
        **A page is a wrapper and the canvas is inside it.** Three boxes have
        to share one origin and one size — the raster, the text the reader
        selects and the links they follow — and only an element holding all
        three can be the child `#pages` indexes, replaces, prunes and measures
        the reader's place against. So `.logical` sits here, `size()` writes
        this box, and the canvas fills it.

        **A page is separated from the next by 16 CSS pixels, and the
        container adds nothing at its own sides.** The gap is chrome rather
        than content,
        so it is a constant: `fit()` and `unscale()` keep writing page sizes
        and know nothing about it, and a gap that grew with the page would read
        as part of the document at a large scale and vanish at a small one.

        **A length and not a ratio.** A percentage margin resolves against the
        containing block's *width*, so it would track the divider — at a narrow
        pane the same declaration renders 8–9 px. Sixteen reads as a separation
        at a glance against a page some 535 px wide and costs only scroll
        distance the reader was passing through anyway.

        **The top margin is load-bearing and the sides are `auto`.**
        `offsetTop` includes an element's top margin, so the reader's anchor
        moves with the gap; `#pages` is a block formatting context by virtue
        of `overflow-y: scroll`, so the first page's margin does not collapse
        out of it; and no *bottom* margin exists, so no pair of siblings
        collapses to less than the constant. **It is on the wrapper and not on
        the canvas**: a layer pinned to the wrapper's origin would otherwise
        sit 16 px above the glyphs it belongs to.

        **The sides centre a page narrower than the pane, and that case is
        new.** Fit-page above its boundary and a small pinned scale both draw
        one; fit-to-width never could. An auto margin resolves to zero when
        the page is at least as wide as the containing block, so fit-to-width
        is untouched to the pixel and a zoomed page still overflows to the
        right, where `overflow-x: auto` makes it reachable.

        **No padding at the container's sides**, and not merely because the
        width is wanted elsewhere: `clientWidth` *includes* padding, so `box()`
        would keep
        reporting the padding-box width, the pages would be sized past the
        content box, and they would clip silently.

        **The hairline is a shadow rather than a border, and it rings all
        four edges.** A border under `content-box` would make each page two
        pixels taller than the height `size()` wrote, and `offsetHeight` —
        which the anchor is expressed in — would stop being the raster's own
        height. `inset` is not the escape: an inset shadow paints beneath a
        replaced element's content, and a canvas is opaque white where
        `pdf.js` filled it. `--edge` is named because a colourless
        `box-shadow` resolves to `currentColor`, which inherits `--ink` — an
        ink ring in light and a near-white one on white paper in dark.

        **It was top-and-bottom-only, and the fits moved the premise it stood
        on.** That premise was that a fit-to-width page meets the scrollport's
        own side edges, so no background sits beside one — true of the only fit
        there was, and false of a page narrower than the pane, where `--ground`
        now shows and the ring is what draws its edge.

        **At fit-width nothing shipped changes visibly**, and the argument is
        the same one Phase 4 made: the side pixels land at x ∈ [−1, 0) and
        [W, W+1), outside the scrollport, and that fit keeps `overflow-x:
        hidden`, whose clip is exactly what removes them. It would be safe
        without the clip too — a `box-shadow` is painted ink rather than
        scrollable overflow, so `auto` shows no track for one — but under a
        pinned scale, where `auto` is on, the page is either wider than the
        pane or centred with room to spare, and the ring is wanted in both.

        **Two of the three custom properties `pdf.js` reads live here.**
        `setLayerDimensions` sizes a layer as `round(down,
        var(--total-scale-factor) * <unscaled>px, var(--scale-round-x))`, and
        the bundle defines none of the three — their definitions ship in
        `pdf_viewer.css`, which this project does not vendor. Undefined, those
        declarations are invalid at computed-value time, the layer takes no
        size at all, and the text paints raw over the raster. `1px` is the
        whole-CSS-pixel rule the pages already follow; `size()` writes the
        third.

        **A page is paper-coloured even when it holds no raster.** Every page is
        laid out at its final size before any of them is drawn, and a long
        document's pages are released again once the reader has left them — so
        this box is on screen empty, and with no background of its own it would
        paint `--ground`: tolerable in light, and a dark rectangle where paper
        belongs in dark.
      */
      #pages .page {
        position: relative;
        display: block;
        margin: 16px auto 0;
        background: var(--paper);
        box-shadow: 0 0 0 1px var(--edge);
        --scale-round-x: 1px;
        --scale-round-y: 1px;
      }
      /*
        **The canvas has no size of its own.** `.logical` moved to the wrapper
        with Phase 2, so `size()` writes that box and nothing writes this one —
        and a canvas with no CSS size lays out at its backing store, which at a
        pixel ratio of 2 is a page twice the pane's width.
      */
      #pages canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /*
        The gap below the last page. **A pseudo-element and not a bottom
        margin**, because whether a scroll container's last child's bottom
        margin reaches `scrollHeight` is engine-dependent and this ships on
        WKWebView; `height` and not a margin of its own, so the 16 px is a real
        in-flow border box rather than a margin that may not be counted.

        **And not a spacer element**: `layoutPages` addresses
        `pages.children[n - 1]` and commits the whole list with
        `replaceChildren`, and `fit`, `unscale`, `readAnchor`, `applyAnchor`,
        `derived` and the drainer all assume every child is a page carrying
        `.logical` and `.natural`. A pseudo-element is in the flow and not in
        `children`, which is exactly the pair of properties wanted.
      */
      #pages::after {
        content: '';
        display: block;
        height: 16px;
      }
      /*
        **The layers `pdf.js` builds and does not style.** The bundle exports
        `TextLayer` and `AnnotationLayer`; what it does not carry is what its
        own viewer wraps around them, and that is `pdf_viewer.css` rather than
        a third module — so this is the app's business and these are the app's
        rules.

        **A text span is given percentage `left` and `top`, `--font-height` in
        unscaled px, a `font-family`, and — when they apply — `--scale-x` and
        `--rotate`. It is given no `position` and no `font-size`.** With no
        rules of our own the percentages resolve against nothing, and the layer
        renders as a wall of readable text over the raster. `--font-height` is
        in the page's *unscaled* units, which is why the size is multiplied by
        `--total-scale-factor` here.

        **The glyphs a reader sees are the raster's**, so the text above them
        is transparent. It is there to be selected and copied, not read.

        **The rotation is applied before the horizontal scale**, which is the
        order `pdf.js` writes and is not interchangeable: `--scale-x` corrects a
        measured width against the width the PDF asked for, which is a length
        along the text's own direction, so it belongs inside the rotation.

        No `.markedContent` rule, and that is not an omission:
        `streamTextContent()` leaves `includeMarkedContent` false, so those
        wrapper spans never reach the layer at all.
      */
      .textLayer {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        overflow: clip;
        line-height: 1;
        text-align: initial;
        transform-origin: 0 0;
        -webkit-text-size-adjust: none;
        text-size-adjust: none;
      }
      .textLayer span,
      .textLayer br {
        position: absolute;
        color: transparent;
        white-space: pre;
        cursor: text;
        transform-origin: 0 0;
        font-size: calc(var(--font-height) * var(--total-scale-factor));
        transform: rotate(var(--rotate, 0deg)) scaleX(var(--scale-x, 1));
      }

      /*
        The same shape one layer up. `_createContainer` builds a `<section>`
        with a percentage box, a `z-index` and **no `position`**, and the `<a>`
        it appends gets no box at all — so a link has nothing to click until
        these rules give it one.

        `pointer-events` is split deliberately: the layer covers the whole page
        and must not take the pointer from the text under it, and each
        annotation must.
      */
      .annotationLayer {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        transform-origin: 0 0;
        pointer-events: none;
      }
      .annotationLayer section {
        position: absolute;
        margin: 0;
        box-sizing: border-box;
        pointer-events: auto;
      }
      .annotationLayer a {
        position: absolute;
        inset: 0;
      }

      /*
        The mark a stale page wears. A page that belongs to older text than the
        file on disk may not pass for the current one, and the error above it
        says why. No word spells "stale" here: that chrome is Phase 3's. **A
        stale page keeps its text selectable and its links live**: it is old,
        not broken.
      */
      #pages.stale {
        opacity: 0.5;
      }

      /* The empty state sits in the same place a page would. */
      #message {
        flex: 1;
        margin: 0;
        padding: 24px;
        white-space: pre-wrap;
        color: var(--quiet);
      }
      /*
        The divergence a refused change leaves. It is not an error and not
        staleness — nothing failed to compile, and the page belongs to the text
        in the pane. Two occasions reach it and Rust words both: the file went
        elsewhere, or the pane is holding work a switch would have thrown away.

        **The way out is a button here rather than chrome in the header**,
        because it is wanted exactly when this bar is drawn and never otherwise.
        Its label is the page's, as every control's label is; the sentence
        beside it is Rust's, as every status sentence is.
      */
      #divergence {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin: 0;
        padding: 8px 12px;
        background: var(--chrome);
        border-bottom: 1px solid var(--edge);
      }
      #divergence[hidden] {
        display: none;
      }
      #divergence-text {
        flex: 1;
        min-width: 0;
      }
      #discard {
        flex: none;
      }

      /* The error sits above the page it does not belong to. */
      #error {
        flex: none;
        margin: 0;
        padding: 8px 12px;
        white-space: pre-wrap;
        color: var(--alarm);
        background: var(--chrome);
        border-bottom: 1px solid var(--edge);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      /* With no page under it, it takes the whole pane instead. */
      #error.alone {
        flex: 1;
        padding: 24px;
        background: none;
        border-bottom: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <button id="toggle" type="button" aria-expanded="true" aria-controls="files" hidden>
        Files
      </button>
      <button id="numbers" type="button" aria-pressed="false" aria-controls="lines">
        Lines
      </button>
      <!--
        How the page fits the pane. The header sits above `main`, so unlike
        the section panel and the line gutter this control takes no width out
        of the column the pages are measured from.

        **Nothing above 400% is offered, and that edge is the cap itself.** A
        pinned page costs `7.645·s²` MiB of backing store at `devicePixelRatio`
        2 whatever the pane measures, so one page alone crosses the 128 MiB
        budget above about 410% — `sqrt(128 / 7.645) = 4.09` — where holding
        fewer pages has stopped being a lever, one being the floor.
      -->
      <select id="fit" aria-label="How the page fits the pane">
        <option value="width" selected>Fit width</option>
        <option value="page">Fit page</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="4">400%</option>
      </select>
      <button id="open" type="button">Open…</button>
      <button id="save" type="button">Save</button>
      <button id="export" type="button">Save a Copy…</button>
      <span id="status"></span>
    </header>
    <main>
      <div id="mirror" aria-hidden="true"></div>
      <nav id="files" hidden aria-label="The project's files">
        <h2>
          Files
          <button
            id="new-toggle"
            class="new"
            type="button"
            aria-expanded="false"
            aria-controls="new-file"
            title="New file…"
          >
            +
          </button>
        </h2>
        <!--
          The one gesture in this panel that is not a row, and it sits outside
          `#parts` because `parts()` runs on every status — every compile, every
          typing settle, every `Tree` event — and replaces that list whole. A
          field inside it would be wiped under the author's fingers by a
          filesystem event they did not cause. Panel-level rather than
          per-row, and it takes the whole root-relative path.

          `mpdf-010` Phase 3.
        -->
        <form id="new-file" hidden>
          <input
            id="new-name"
            type="text"
            required
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="sections/method.md"
            aria-label="A new file, named relative to the project"
          />
          <button type="submit">New</button>
        </form>
        <p id="new-refusal" hidden></p>
        <ol id="parts"></ol>
      </nav>
      <div id="lines" hidden aria-hidden="true"></div>
      <textarea
        id="text"
        spellcheck="false"
        disabled
        aria-label="The document's markdown"
      ></textarea>
      <figure id="viewer" hidden aria-label="A figure from the project">
        <div class="bar">
          <span class="path"></span>
          <button id="close-viewer" type="button">Back to the text</button>
        </div>
        <div class="sheet"></div>
      </figure>
      <div id="divider" role="separator" aria-orientation="vertical"></div>
      <section id="preview">
        <p id="message">Open a markdown file to see its PDF. ⌘O</p>
        <p id="divergence" hidden>
          <span id="divergence-text"></span>
          <button id="discard" type="button">Discard</button>
        </p>
        <p id="error" hidden></p>
        <div
        id="pages"
        hidden
        tabindex="0"
        role="region"
        aria-label="The compiled PDF"
      ></div>
      </section>
    </main>

    <script type="module">
      /*
        **`pdf.js` is vendored, not built**: two static ES modules under
        `pdfjs/`, loaded straight from a module script. No npm at build time,
        no bundler, no node — which is the whole of what `withGlobalTauri`
        bought and what this must not spend.

        **The worker is a second file and is not optional.** Parsing and
        rasterisation happen off the main thread, because this pane re-renders
        every time the typing stops and rasterising on the main thread would
        freeze the text the author is typing into.
      */
      import * as pdfjs from './pdfjs/pdf.min.mjs'
      pdfjs.GlobalWorkerOptions.workerSrc =
        new URL('./pdfjs/pdf.worker.min.mjs', import.meta.url).href

      /*
        **The types this file is checked against, in one block.** Everywhere
        else the comments here are arguments; JSDoc is annotation, and
        interleaving the two would cost the arguments their shape. What runs the
        check is `app/typecheck.mjs`, which is not part of any build — see
        `app/tsconfig.json` for why its settings are what they are.

        **`Status`, `Anchor` and `Entry` are the point, and they are the three
        that can lie.** `invoke` returns an untyped value and this page reads eleven
        fields off it by name, so a field renamed in Rust would break the window
        silently at runtime. `app/src/preview.rs`'s own test compares the
        `@property` lists below against a serialized `Status` — two declarations
        checked against each other, rather than usage checked against a
        declaration — so keep them written as they are and the test will keep
        them true.
      */

      /**
       * Everything the window says about the last compile, in one value:
       * `app/src/preview.rs:Status`, as `invoke('status')` answers it.
       *
       * @typedef {object} Status
       * @property {'empty' | 'current' | 'stale' | 'failed'} state
       * @property {string | null} time
       * @property {string | null} error
       * @property {boolean} page
       * @property {string | null} divergence
       * @property {number} revision
       * @property {number} reloaded
       * @property {Anchor[]} anchors
       * @property {Entry[]} entries
       * @property {string | null} main
       * @property {string | null} edited
       */

      /**
       * One file in the project, and one row of the panel:
       * `app/src/document.rs:Entry`.
       *
       * `path` is root-relative with `/` separators on every platform, so this
       * page splits it into segments without knowing what a path is on the
       * machine it is running on. **A directory is never one of these** — the
       * folder headings are derived from the segments here.
       *
       * @typedef {object} Entry
       * @property {string} path
       * @property {'markdown' | 'bibliography' | 'image'} kind
       * @property {boolean} missing
       */

      /**
       * A heading in the document the pane holds, and the page its compiled
       * form landed on: `app/src/document.rs:Anchor`. **Both are 1-based**, and
       * neither is the `Place` below.
       *
       * @typedef {object} Anchor
       * @property {number} line
       * @property {number} page
       */

      /**
       * Where the reader is. **A 0-based index and a fraction, not an
       * `Anchor`** — the two are a page apart and the collision is the reason
       * this one is named separately.
       *
       * @typedef {object} Place
       * @property {number} page
       * @property {number} fraction
       */

      /** A CSS or a PDF-unit size, depending on which of a wrapper's two it is.
       * @typedef {{ w: number, h: number }} Size */

      /**
       * A page's own element, and the four properties this file hangs on it:
       * the CSS box it is written at, its size in the document's own units, the
       * viewport a destination is resolved through, and its 1-based number.
       *
       * @typedef {HTMLElement & { logical: Size, natural: Size, view: PageViewport, number: number }} PageWrapper
       */

      /** The container of those, whose children are all wrappers.
       * @typedef {HTMLElement & { children: HTMLCollectionOf<PageWrapper> }} PagesPane */

      /** A page's raster, tagged with the document generation it was drawn from.
       * @typedef {HTMLCanvasElement & { gen: number }} PaneCanvas */

      /** @typedef {import('pdfjs-dist').PDFDocumentProxy} PDFDocumentProxy */
      /** @typedef {import('pdfjs-dist').PDFDocumentLoadingTask} PDFDocumentLoadingTask */
      /** @typedef {import('pdfjs-dist').PDFPageProxy} PDFPageProxy */
      /** @typedef {import('pdfjs-dist').PageViewport} PageViewport */

      /** A viewport at scale 1, whose `rawDims` the vendored declarations type
       * only as `Object`.
       * @typedef {PageViewport & { rawDims: { pageWidth: number, pageHeight: number } }} UnitViewport */

      /** What `box()` reads off the container. @typedef {{ width: number, height: number }} Room */

      /** Where each gutter row starts, carrying the heights it was built from.
       * @typedef {number[] & { heights: number[] }} Rows */

      /*
        **`withGlobalTauri` puts an untyped API on `window`**, and typing it
        here would be a hand-written shim for somebody else's interface — the
        drift hazard this file vendors `pdfjs-dist`'s own declarations to avoid,
        reintroduced for the one dependency that has no declarations to vendor.
        So the three below, and `window.__pane` further down, reach their
        property by name rather than through a cast: what they destructure is
        checked by the window opening, and what they carry across is checked by
        `Status`. **The form is not a preference.** A cast is written
        `(window).__pane = pane` with the type in a comment before it, and on
        that line the preceding `}` turns the object literal above into a call
        — which is what this check reported the first time it was tried.
      */
      const { open, save } = window['__TAURI__'].dialog
      const { invoke } = window['__TAURI__'].core
      const { listen } = window['__TAURI__'].event

      const pages = /** @type {PagesPane} */ (document.getElementById('pages'))
      const text = /** @type {HTMLTextAreaElement} */ (document.getElementById('text'))
      const message = document.getElementById('message')
      const divergence = document.getElementById('divergence')
      const divergenceText = document.getElementById('divergence-text')
      const error = document.getElementById('error')
      const status = document.getElementById('status')
      const fitControl = /** @type {HTMLSelectElement} */ (document.getElementById('fit'))

      /*
        The document the canvases were drawn from, held between renders, and
        the loading task it came from.

        **A re-render caused by geometry alone draws from this and asks Rust
        for nothing.** That is not an optimisation: `current_pdf` refuses while
        the preview is stale, so a pane that re-fetched on a resize could not
        re-fit a stale page — which is the case a fit that cannot go stale is
        strongest about.

        **The task is held because it is what can be destroyed.** A
        `PDFDocumentProxy` has no `destroy` of its own; the loading task does,
        and it takes the worker with it. Every open starts a worker, and this
        pane re-opens every time the typing stops, so dropping one without
        destroying it leaks a thread and its copy of the document per compile.
      */
      /** @type {PDFDocumentLoadingTask | null} */
      let loading = null
      /** @type {PDFDocumentProxy | null} */
      let doc = null

      /*
        The generation of the render now wanted, and the tasks the last one
        left running. A render in flight is cancelled before the next begins,
        and every await inside a render checks it is still the wanted one
        before it touches the page.
      */
      let renderSeq = 0
      const inflight = new Set()

      /*
        How many *sizing passes* are running, so a rest can wait for one rather
        than cancel it. A count and not a flag: a pass being superseded overlaps
        the one superseding it, and a flag would be cleared by the loser on its
        way out.

        **The drainer is deliberately outside this bracket**, and that is a rule
        rather than an oversight. `rerender` defers while this is above zero, so
        a drain counted here would re-arm the 200 ms timer for as long as it ran
        — and a drain runs for as long as the reader keeps giving it pages.
      */
      let rendering = 0

      /*
        What this page has already taken from Rust. Both are counters Rust
        keeps, and both exist to stop this page doing work that would cost the
        reader something.

        `revision` counts compiles that produced bytes: a signal that carries
        no new page must not redraw the frame, because a redraw moves the
        reader off whatever they were looking at and the app's own save now
        compiles nothing at all.

        `reloaded` counts the times Rust replaced the buffer from disk. The
        text is re-read on that and on nothing else, so a fetch can never race
        a keystroke still in flight and put an older text back in the pane.
      */
      let drawnRevision = -1
      let takenReload = -1

      async function openDocument() {
        const path = await open({
          multiple: false,
          directory: false,
          filters: [{ name: 'Markdown', extensions: ['md'] }]
        })
        if (path === null) return // the user cancelled

        // The page on screen belongs to the document being replaced, so it
        // goes before the new one is asked for. Rust clears its own bytes for
        // the same reason.
        clear()

        try {
          await invoke('open_document', { path })
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        Take the document Finder handed the app, if one is waiting.

        A file association only launches the app; the path arrives in Rust as a
        run event, which can land before this script has run at all. So Rust
        parks it and this takes it — at startup, and again on every `opened`
        signal. The take empties the slot, so whichever of the two runs second
        gets nothing and does nothing, and the document opens once.

        It goes through `clear()` and `open_document` exactly as the dialog
        does. That is not tidiness: `clear()` is where this page resets the two
        counters it compares Rust's against, and Rust restarts both at 0 for
        every document, so an open that skipped it would leave both panes
        showing the old document under a new title.
      */
      async function takePendingOpen() {
        let path
        try {
          path = await invoke('pending_open')
        } catch (problem) {
          fail(problem)
          return
        }
        if (path === null) return // nothing was waiting

        clear()

        try {
          await invoke('open_document', { path })
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        Write the pane's text to the document's own path.

        The text goes over first, so the file is the pane and not the pane a
        moment ago: the keystroke that landed while the menu was opening is in
        Rust's buffer before the save reads it.
      */
      async function saveDocument() {
        try {
          await invoke('edit', { text: text.value })
          await invoke('save')
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        Save the page itself, where the user asks.

        Rust is asked for the default path first, and it refuses there when the
        pane is not current — so a pane with nothing to write never opens a
        dialog whose answer it would throw away. Nothing recompiles: the file
        is the bytes on screen.
      */
      async function exportDocument() {
        let defaultPath
        try {
          defaultPath = await invoke('export_path')
        } catch (problem) {
          fail(problem)
          return
        }

        const path = await save({
          defaultPath,
          filters: [{ name: 'PDF', extensions: ['pdf'] }]
        })
        if (path === null) return // the user cancelled

        try {
          await invoke('export', { path })
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        Every compile — the one an open asks for, and the ones the watch loop
        makes with nobody asking — ends in this. The signal carries no payload
        and the bytes come back through a command, because an event carrying
        them would serialize them as a JSON array of numbers, one per byte.

        The status comes back through a second command rather than with the
        bytes, because the bytes cross raw and a status does not. It arrives
        first, so the page knows whether there are new bytes to ask for at all.
      */
      async function refresh() {
        /** @type {Status} */
        let state
        try {
          state = await invoke('status')
        } catch (problem) {
          fail(problem)
          return
        }

        report(state)

        /*
          Rust took a text from disk: an open, or an external change over a
          clean buffer. That is the only time this page's own text is replaced.

          The answer is captured before `takenReload` moves, because the pass
          that replaced the text is exactly the pass that must not follow the
          caret: assigning a textarea's `value` moves its caret to the end of
          the control, so following one here would open every document on its
          last page. An open is not a cursor movement.
        */
        const tookReload = state.reloaded !== takenReload
        if (tookReload) {
          takenReload = state.reloaded
          try {
            text.value = await invoke('document_text')
            relines()
          } catch (problem) {
            fail(problem)
          }
        }

        if (state.state !== 'current' || state.revision === drawnRevision) return

        try {
          const bytes = await invoke('current_pdf')
          /*
            **Only a render that drew may advance this.** `openPdf` returns
            false when it was superseded or could not measure the pane, and
            recording the revision anyway would tell the next signal that a
            page nobody ever drew is already on screen — after which
            `refresh` returns at the guard above forever, with no error and
            no way back.
          */
          if (await openPdf(bytes, tookReload ? null : caretPage(state.anchors))) {
            drawnRevision = state.revision
          }
        } catch (problem) {
          fail(problem)
        }
      }

      /*
        The page the caret is in: the last heading at or above it, and `null`
        when there is none — a caret above the first heading, or a document with
        no headings at all. Both want page 1, which is where a frame with no
        fragment opens by itself, so neither is a case here.

        Counting newlines is not parsing markdown, and the distinction is the
        point rather than pedantry: this page owns no knowledge of the dialect
        and must not start owning any. It is also the one quantity both sides
        agree on, `selectionStart` being a UTF-16 offset where a line in Rust is
        counted from bytes.

        The precision is the document's heading density, and it follows the
        author rather than the reader: scroll the pane elsewhere and the next
        compile brings it back to the caret.
      */
      /**
       * @param {Anchor[]} anchors
       * @returns {number | null}
       */
      function caretPage(anchors) {
        const line = text.value.slice(0, text.selectionStart).split('\n').length

        let page = null
        for (const anchor of anchors) {
          if (anchor.line > line) break
          page = anchor.page
        }
        return page
      }

      /*
        Put the status where the window shows it: the line in the header, the
        error bar, and the mark a stale page wears. Every word here was chosen
        in Rust — the state's own name and the compile time — so this places
        text and never composes it.
      */
      /** @param {Status} state */
      function report(state) {
        status.className = state.state
        status.textContent = state.time
          ? `${state.state} · ${state.time}`
          : state.state

        error.textContent = state.error ?? ''
        error.hidden = state.error === null
        error.classList.toggle('alone', !state.page)

        divergenceText.textContent = state.divergence ?? ''
        divergence.hidden = state.divergence === null

        message.hidden = state.state !== 'empty'
        text.disabled = state.state === 'empty'
        pages.classList.toggle('stale', state.error !== null && state.page)

        parts(state)
      }

      /*
        Draw the project's files. The row whose path is `main` is marked, by
        name and not by position — a project's master need not be its first
        file, and two files of the same name in different folders must not both
        light up.

        It is rebuilt on every status, which is every compile, and that is
        still fine: **the rows hold no selection.** Which file compiles lives in
        Rust and arrives in the status, so a rebuild cannot lose it, and the one
        button on a row reads its path off the DOM at the moment it is clicked.
        A row that remembered something of its own would make this wrong.

        **The disk half of the list is stable and only the marked-missing half
        moves.** Rust walks the directory at an open and at a filesystem event
        under the root, never per keystroke; the rows for files a master names
        and the disk does not hold come off the text and do follow it. That is
        strictly less motion than the section panel this replaces, which was
        entirely the text's.
      */
      const files = document.getElementById('files')
      const list = document.getElementById('parts')
      const toggle = document.getElementById('toggle')

      /*
        Folded or not, held in the page. **Decided there rather than in
        `Preview`**, and it does not survive a restart.

        This app keeps its state in Rust where a test can reach it, and a flag
        kept in `localStorage` here would be the one piece of window state no
        test could hold. But that rule is about state that *decides
        behaviour*, and a fold decides nothing but its own drawing — nothing
        else reads it. Moving it to `Preview` would buy nothing either: both
        die with the process, and a fold already survives an Open where it
        lives, `parts` reapplying `.collapsed` on every status.

        **This app does now persist one thing**, since `mpdf-010` Phase 1: which
        file a project compiles, in Application Support. That is deliberately
        not a precedent for the fold. It is remembered because it is a decision
        the author made about their document and would have to make again; a
        fold is where a scrollbar was.
      */
      let folded = false

      toggle.addEventListener('click', () => {
        folded = !folded
        toggle.setAttribute('aria-expanded', String(!folded))
        files.classList.toggle('collapsed', folded)
      })

      /*
        The panel's own gesture: name a file and the project gains it.

        **Showing or not is page state, and `folded` above is the precedent.**
        The rule that keeps this app's state in Rust is about state that decides
        *behaviour*; whether a text field is on screen decides nothing but its
        own drawing, nothing else reads it, and putting it in `Preview` would
        buy the same nothing a folded panel would.

        `mpdf-010` Phase 3.
      */
      const newToggle = document.getElementById('new-toggle')
      const newFile = /** @type {HTMLFormElement} */ (document.getElementById('new-file'))
      const newName = /** @type {HTMLInputElement} */ (document.getElementById('new-name'))
      const newRefusal = document.getElementById('new-refusal')

      /**
       * Show the name field, or put it away — emptying it either way.
       *
       * @param {boolean} open
       */
      function nameFile(open) {
        newToggle.setAttribute('aria-expanded', String(open))
        newFile.hidden = !open
        newRefusal.hidden = true
        newRefusal.textContent = ''
        newName.value = ''
        if (open) newName.focus()
      }

      newToggle.addEventListener('click', () => nameFile(newFile.hidden))

      // **Not in the global handler at the figure surface below**, and it does
      // not stop the event: `Escape` goes on meaning *no figure* as well, which
      // is that handler's own promise that nothing else loses the key.
      newName.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') nameFile(false)
      })

      /**
       * Ask Rust for the file. The path is the whole root-relative spelling the
       * panel's rows use, extension and all — the extension is what decides the
       * kind, and `document::kind_of` is what reads it, so there is no kind to
       * send.
       *
       * **A refusal lands beside the field and nowhere else.** `fail` would add
       * `stale` to the compiled page, and a gesture that compiled nothing must
       * not tell the reader their PDF is out of date; the divergence bar would
       * draw a `Discard` beside it, which means nothing for a create. The
       * sentence is Rust's — this places it, as every status sentence is placed.
       *
       * **Nothing here draws the new row.** The file lands under the watched
       * root, so it arrives as `watch::Change::Tree` one debounce later and the
       * panel is rebuilt off the status that follows, which is the same path an
       * external `touch` takes.
       *
       * The field stays open on success and takes focus again: an author adding
       * sections adds several, and the `+` is what says they are done.
       *
       * @param {SubmitEvent} event
       */
      async function createFile(event) {
        event.preventDefault()
        newRefusal.hidden = true
        try {
          await invoke('create_file', { path: newName.value })
        } catch (problem) {
          newRefusal.textContent = String(problem)
          newRefusal.hidden = false
          return
        }
        newName.value = ''
        newName.focus()
      }

      newFile.addEventListener('submit', createFile)

      /** @param {Status} state */
      function parts(state) {
        // **Absent is exactly "no document is open".** Every open document
        // draws a panel, including one that names nothing — which is what lets
        // an author build a first section from inside the window.
        files.hidden = state.state === 'empty'
        toggle.hidden = files.hidden
        if (files.hidden) {
          list.replaceChildren()
          return
        }

        files.classList.toggle('collapsed', folded)
        list.replaceChildren(...panelRows(state.entries, state.main, state.edited))
      }

      /**
       * The panel's rows: one per entry, with a heading wherever the folder
       * changes.
       *
       * Rust sends no directories and sends the entries already ordered — files
       * before folders, each byte-wise alphabetical — so a heading is needed
       * exactly where a path's leading segments differ from the last one's, and
       * the depth is how many segments precede the name.
       *
       * @param {Entry[]} entries
       * @param {string | null} main
       * @param {string | null} edited
       * @returns {HTMLElement[]}
       */
      function panelRows(entries, main, edited) {
        const drawn = []
        let folder = []

        for (const entry of entries) {
          const segments = entry.path.split('/')
          const here = segments.slice(0, -1)

          // Where the folder changed, name every segment of it that is new.
          // A file two directories deeper than the last one is two headings,
          // which is what makes the panel readable without sending a tree.
          let shared = 0
          while (shared < here.length && here[shared] === folder[shared]) shared++
          for (let at = shared; at < here.length; at++) {
            drawn.push(folderRow(here[at], at))
          }
          folder = here

          drawn.push(fileRow(entry, here.length, entry.path === main, entry.path === edited))
        }
        return drawn
      }

      /*
        The figure viewer. `mpdf-010` Phase 5, out of the prototype that
        resolved OQ-1: an image row shows the picture, and the pane goes on
        holding the file it held.

        **The bytes come through a command and become a blob**, which is
        `current_pdf`'s own route: the webview cannot read `file://` without
        Tauri's asset protocol, and that would want a scope in
        `tauri.conf.json` and a capability where an app-defined command wants
        neither. The URL is revoked when the next one replaces it, or the
        window holds every figure the reader has looked at for its own lifetime.
      */
      const viewer = document.getElementById('viewer')
      const viewerPath = viewer.querySelector('.path')
      const viewerSheet = viewer.querySelector('.sheet')
      let viewing = null
      /*
        **Which request the surface belongs to**, and it is `renderSeq`'s idea
        applied to a second asynchronous pass. The read crosses IPC, so a reader
        who clicks a figure and changes their mind has a real window in which to
        do it — and without this every one of those gestures was undone by the
        bytes arriving afterwards: `Escape` put the figure back up, asking for a
        markdown row drew the picture over the file it had just opened, and two
        figures in flight left the bar naming one and the sheet holding the
        other. Measured, not reasoned about: all three reproduce against a read
        delayed 400 ms.

        Every entry to `showAsset` and every exit through `hideAsset` takes the
        next number, so a pass that comes back to find it moved has been
        superseded and draws nothing.
      */
      let viewSeq = 0

      /*
        Keep the surface over the text pane's own column.

        **What decides that column is watched, and the causes are not** — this
        file's own rule, which an earlier draft of this phase broke and a review
        caught. That draft named five gestures: a show, a window resize, the end
        of a divider drag, the panel fold and the `Lines` toggle. It dropped two
        more, and they are not exotic: `#files` is `flex: 0 0 auto` and `#lines`
        has no width of its own, so **both are as wide as their contents**, and
        `parts` rebuilds the panel on *every* status while `relines` rewrites
        the gutter on every keystroke. A project gaining a file with a longer
        name, or a document crossing from 99 lines to 100, moves `#text`'s left
        edge with no gesture at all — and the figure would sit off its column
        until something in the list of five happened.

        Only three boxes decide where that column is and how wide it is:
        `#files` and `#lines`, which are all that sit to its left, and `#text`
        itself, whose own width the divider and the window set. Observing those
        is structural where a list of gestures is a guess, and it is the same
        answer the pane's own observer gives. **It cannot loop**: `#viewer` is
        absolutely positioned and out of flow, so nothing this writes can resize
        anything being observed.
      */
      function placeViewer() {
        if (viewer.hidden) return
        viewer.style.left = `${text.offsetLeft}px`
        viewer.style.width = `${text.offsetWidth}px`
      }

      const column = new ResizeObserver(placeViewer)
      // By id rather than by the handles above: `#lines` is declared with the
      // gutter, hundreds of lines below this, and reaching it early is the
      // block-scoped-use-before-declaration the type check exists to catch.
      for (const box of ['files', 'lines', 'text']) column.observe(document.getElementById(box))

      /**
       * Put a sentence in the sheet where the figure would have gone.
       *
       * **Three things reach here and only one of them composes its own
       * words.** A refusal from `asset_bytes` arrives in Rust's, and this
       * places it exactly as the status bar places a compile's; the `.pdf`
       * line and the undecodable-figure line are the page's, on the ground
       * that both are labels about a kind of file rather than statements about
       * the document.
       *
       * **What none of them may do is reach `fail`.** That marks the compiled
       * page stale, and a click that compiled nothing must not tell the reader
       * their PDF is out of date — the rule the `.pdf` branch was written to
       * obey, which the error path was quietly breaking.
       *
       * @param {string} sentence @param {string} path
       */
      function saySoInstead(sentence, path) {
        if (viewing !== null) URL.revokeObjectURL(viewing)
        viewing = null
        const said = document.createElement('p')
        said.className = 'said'
        said.textContent = sentence
        viewerPath.textContent = path
        viewerSheet.replaceChildren(said)
        viewer.hidden = false
        placeViewer()
      }

      /** One of the three ways back to the text, and the one the other two call. */
      function hideAsset() {
        // **Before anything else**: a read still in flight is now superseded,
        // and this is what stops it drawing over a reader who has left.
        viewSeq++
        viewer.hidden = true
        viewerSheet.replaceChildren()
        if (viewing !== null) URL.revokeObjectURL(viewing)
        viewing = null
      }

      /**
       * Show one of the project's figures over the text pane.
       *
       * **The extension is read before anything is asked for**, because a PDF
       * is a legal figure in this dialect — `pdf` is in
       * `md2pdf_core::IMAGE_EXTENSIONS` and the panel lists one — and `<img>`
       * will not draw it. That row gets a sentence and the command is never
       * called for it at all. **The sentence is the page's own**, which is a
       * deliberate exception to the rule that the window composes no text: the
       * two Rust routes are both wrong here, `fail` marking the compiled page
       * stale for a click that compiled nothing and `divergence` drawing a
       * `Discard` button beside it, and a field on `Status` is what this
       * phase's own invariant refuses. It is a label for a file kind, not a
       * status about the document — the distinction that rule was always about,
       * and the one under which `Back to the text` is the page's too.
       *
       * @param {string} path
       */
      async function showAsset(path) {
        const seq = ++viewSeq
        const extension = (path.split('.').pop() ?? '').toLowerCase()

        if (extension === 'pdf') {
          saySoInstead('A PDF figure is not drawn here.', path)
          return
        }

        let bytes
        try {
          bytes = await invoke('asset_bytes', { path })
        } catch (problem) {
          // A refusal for a figure the reader has already left is not theirs to
          // read. One that is theirs goes in the sheet and not through `fail`,
          // for `saySoInstead`'s reason.
          if (seq === viewSeq) saySoInstead(String(problem), path)
          return
        }

        if (seq !== viewSeq) return

        /*
          **`.svgz` is gzip and an `<img>` will not unwrap one.** It is in
          `md2pdf_core::IMAGE_EXTENSIONS`, so the panel lists one and the
          pipeline typesets it perfectly well; a blob URL carries no
          `Content-Encoding`, so handing the bytes over as they are drew a
          permanently blank sheet. Unwrapping them here is three lines and keeps
          a legal figure viewable, where the alternative was a second sentence
          saying this app could not show a file it compiles. A failure falls
          through to the image's own `onerror` below.
        */
        let data = bytes
        if (extension === 'svgz') {
          try {
            data = await new Response(
              new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))
            ).arrayBuffer()
          } catch {
            data = bytes
          }
          if (seq !== viewSeq) return
        }

        if (viewing !== null) URL.revokeObjectURL(viewing)
        const type =
          extension === 'svg' || extension === 'svgz'
            ? 'image/svg+xml'
            : extension === 'jpg'
              ? 'image/jpeg'
              : `image/${extension}`
        viewing = URL.createObjectURL(new Blob([data], { type }))

        const picture = document.createElement('img')
        /*
          **A figure that will not decode says so rather than drawing nothing.**
          Truncated, corrupt, or a kind this engine will not take: without this
          the surface opened with the path in its bar over an empty sheet, and
          stayed that way, which reads as the app having done nothing at all.
        */
        picture.onerror = () => {
          if (seq === viewSeq) saySoInstead('This figure could not be drawn.', path)
        }
        picture.src = viewing
        picture.alt = path
        // **The label is written here and not before the read**, or the bar
        // names the last row clicked while the sheet holds the last one to
        // arrive, which is the third of the three gestures this guard fixes.
        viewerPath.textContent = path
        viewerSheet.replaceChildren(picture)

        viewer.hidden = false
        placeViewer()
      }

      document.getElementById('close-viewer').addEventListener('click', hideAsset)
      // The reader arrives at a figure by three routes, so there are three ways
      // back: this key, the surface's own control, and asking for a markdown
      // row — which already means *put that file in the pane* and must not
      // leave a picture over it. `clear()` closes it too, an open being a new
      // project.
      addEventListener('keydown', (e) => {
        /*
          **Unconditional, and the condition it replaces was the defect.**
          Guarding on `!viewer.hidden` reads as tidy and is wrong in the one
          case that matters: while the read is in flight the surface is still
          hidden, so the key did nothing, `viewSeq` never moved, and the bytes
          arriving afterwards put the figure up on a reader who had just asked
          for it to go away. `Escape` means *no figure*, whether one is up or
          one is coming. It costs nothing in the empty state — a `hidden` that
          is already true, a sheet already empty, no URL to revoke — and it
          calls no `preventDefault`, so nothing else loses the key.
        */
        if (e.key === 'Escape') hideAsset()
      })

      /** @param {string} name @param {number} depth @returns {HTMLElement} */
      function folderRow(name, depth) {
        const li = document.createElement('li')
        li.className = 'folder'
        li.dataset.depth = String(Math.min(depth, 5))
        const label = document.createElement('span')
        label.className = 'name'
        label.textContent = name
        li.append(label)
        return li
      }

      /**
       * One file's row: its name, and either the mark that says it compiles or
       * the button that would make it.
       *
       * **The button carries the path rather than the row's text**, because the
       * text is the last segment and the path is what Rust is handed. Only a
       * markdown file gets one: nothing else can be the file that compiles.
       *
       * **The name is a button when the row opens or shows, and a span when it
       * does neither.** A markdown file the pane is not already holding goes in
       * the pane; an image is shown over the pane, the pane keeping its own
       * file, which is where `mpdf-010` OQ-1 landed. A bibliography is still
       * inert and says so in its title, where OQ-2 leaves it, and so is a
       * marked-missing row, which names a file the disk does not hold. The
       * markdown row the pane already holds is inert for the reason the `main`
