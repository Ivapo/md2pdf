# The browser front end, owned by `mpdf-006`. It began as a spike answering
# three questions a browser can answer and this machine cannot — whether
# `md2pdf-core` runs as WebAssembly at all, what the module costs over the wire,
# and whether Safari agrees with Chromium about both — and all three still hold.
# What changed is what it is for: `mpdf-006` promoted it to the project's front
# door, the first place a reader meets the tool without installing anything.
#
# The crate keeps the name the spike gave it. `web/index.html` imports
# `./pkg/md2pdf_web_spike.js` and the Pages workflow copies that directory
# wholesale, so renaming it would break the published page to no end.
#
# **Deliberately not a workspace member.** The empty `[workspace]` table below
# detaches it from the root workspace, so `cargo build --workspace` and
# `cargo test --workspace` — which every phase's exit gate runs — behave exactly
# as they did before this directory existed.
[workspace]

[package]
name = "md2pdf-web-spike"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
md2pdf-core = { path = "../core" }
wasm-bindgen = "0.2.104"
console_error_panic_hook = "0.1.7"

# The module is the whole download, so it is optimised for size rather than
# speed. Measured on 2026-08-15: 25.7 MB raw, 7.8 MB brotli. The fonts are
# 2.5 MB of that; the rest is Typst and the PDF writer.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
