# Type-checks the desktop front end — `app/dist/index.html`, the one file the
# whole page is.
#
# **It runs here and not in `cargo test`.** bun is not a prerequisite of this
# workspace, and making the Rust suite depend on one would charge every build of
# the app a node toolchain in order to check a file that suite does not
# otherwise touch. The Rust half of the same check — the test comparing the
# page's `Status` typedef to a serialized `Status` — does run there, and costs
# nothing.
#
# This runs `app/typecheck.mjs` alone. No Rust, no `web/`, no wasm: `pages.yml`
# owns that five-minute build and nothing here can trigger it.
name: typecheck

on:
  push:
    branches: [main]
    # The page, the settings, the declarations it is checked against, and the
    # script that assembles the two. Nothing else can change the answer.
    paths:
      - 'app/dist/index.html'
      - 'app/tsconfig.json'
      - 'app/types/**'
      - 'app/typecheck.mjs'
      - '.github/workflows/typecheck.yml'
  workflow_dispatch:

# A superseded run is not worth finishing.
concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bun for `bunx` alone. The TypeScript version is pinned inside the
      # script, not here: a bare `bunx tsc` resolves to whatever is current.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check the page
        run: bun app/typecheck.mjs
