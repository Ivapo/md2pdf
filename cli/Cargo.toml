[package]
name = "md2pdf-cli"
description = "Command-line front end for md2pdf-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "md2pdf"
path = "src/main.rs"

[dependencies]
md2pdf-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
