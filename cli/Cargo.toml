[package]
name = "md2pdf-cli"
description = "Command-line front end for md2pdf-core."
version.workspace = true
edition.workspace = true
license.workspace = true
# What the registry wants beyond the four above, added by `mpdf-011` Phase 3.
# `readme` reaches one level out of the package: cargo copies the file into the
# archive and rewrites the field, so the crate page shows the repository's own
# README rather than a second copy kept in step by hand.
repository = "https://github.com/Ivapo/md2pdf"
readme = "../README.md"
keywords = ["markdown", "pdf", "typst", "typesetting", "cli"]

[[bin]]
name = "md2pdf"
path = "src/main.rs"

[dependencies]
# **The `version` is not decoration.** A published crate cannot depend on a path,
# so `cargo publish` refuses this crate outright without it; the path is what a
# workspace build uses and the version is what the registry resolves.
md2pdf-core = { path = "../core", version = "0.3.0" }
clap = { version = "4", features = ["derive"] }
# The client `--fetch` downloads images with, and nothing else reaches it: `core`
# stays network-free. `rustls` brings TLS with bundled webpki roots, so a fetch
# trusts the same roots on every machine. **The defaults are off on purpose.**
# `gzip` would decode after the size cap counts, so a small body could inflate
# past any limit in memory; without it the cap counts exactly the bytes handed to
# `core`. `cookies` is not a default and stays off: a fetch keeps no state.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
