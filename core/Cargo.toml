[package]
name = "md2pdf-core"
description = "Converts markdown to Typst markup and compiles it to a PDF."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "md2pdf_core"
path = "src/lib.rs"

[dependencies]
pulldown-cmark = "0.13.4"
# The LaTeX-to-Typst converter, taken as a Rust crate rather than as the Typst
# package of the same name: the package resolves through Typst's registry, which
# is a network fetch, and loads a WASM plugin. `convert_math` is a pure function
# over a string, so a formula is converted in process before Typst sees it.
mitex = "0.2.4"
thiserror = "2"
# The parser keys its own footnote labels by `UniCase`, so the emitter matches
# them the same way rather than by their raw spelling. This is already in the
# tree as pulldown-cmark's own dependency.
unicase = "2"
# The bibliography reader, and not a second one: this is the crate and the
# version `typst-library` 0.15.1 already depends on directly, so naming it here
# adds no crate to the tree — `biblatex` 0.12.0 arrives under it either way, on
# `wasm32` as well. Reading the file with Typst's own reader at Typst's own
# version is also what stops this crate's key set and Typst's disagreeing.
hayagriva = "0.10.1"
typst = "0.15.1"
typst-pdf = "0.15.1"
