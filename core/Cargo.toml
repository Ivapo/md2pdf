[package]
name = "md2pdf-core"
description = "Converts markdown to Typst markup and compiles it to a PDF."
version.workspace = true
edition.workspace = true
license.workspace = true
# What the registry wants beyond the four above, added by `mpdf-011` Phase 3.
# `readme` reaches one level out of the package: cargo copies the file into the
# archive and rewrites the field, so the crate page shows the repository's own
# README rather than a second copy kept in step by hand.
repository = "https://github.com/Ivapo/md2pdf"
readme = "../README.md"
keywords = ["markdown", "pdf", "typst", "typesetting", "converter"]

[lib]
name = "md2pdf_core"
path = "src/lib.rs"

[dependencies]
pulldown-cmark = "0.13.4"
# The LaTeX-to-Typst converter, taken as a Rust crate rather than as the Typst
# package of the same name: the package resolves through Typst's registry, which
# is a network fetch, and loads a WASM plugin. `convert_math` is a pure function
# over a string, so a formula is converted in process before Typst sees it.
mitex = "0.2.4"
thiserror = "2"
# The parser keys its own footnote labels by `UniCase`, so the emitter matches
# them the same way rather than by their raw spelling. This is already in the
# tree as pulldown-cmark's own dependency.
unicase = "2"
# The bibliography reader, and not a second one: this is the crate and the
# version `typst-library` 0.15.1 already depends on directly, so naming it here
# adds no crate to the tree — `biblatex` 0.12.0 arrives under it either way, on
# `wasm32` as well. Reading the file with Typst's own reader at Typst's own
# version is also what stops this crate's key set and Typst's disagreeing.
hayagriva = "0.10.1"
# The Mermaid renderer, a headless Rust implementation of mermaid.js: a
# `mermaid` fence is laid out and drawn to SVG in process, with no browser, no
# filesystem, no clock and no network, on `wasm32` as natively. Pinned exactly
# because it is alpha. Its default set is `svg` plus the Cytoscape layout and
# math labels, and no diagram type the dialect lists needs either, so the
# defaults are off; the EPL-2.0 ELK layout and the system clock, time-zone and
# randomness adapters are opt-in whichever way this is written, and stay off.
merman = { version = "=0.8.0-alpha.6", default-features = false, features = ["svg"] }
# merman's site config is built by `MermaidConfig::from_value`, which takes a
# `serde_json::Value`, and merman does not re-export the crate. It is already in
# the tree, under Typst, so naming it here adds nothing.
serde_json = "1"
typst = "0.15.1"
typst-pdf = "0.15.1"
